# CampaignGenerator workspace config
# Generated by new_workspace.py — edit paths here if you move files.

system_prompt: config/system_prompt.md

log_dir: logs

# Agent prompts for --mode pipeline (kept in the code directory)
agents:
  lore_oracle: config/agents/lore_oracle.md
  encounter_architect: config/agents/encounter_architect.md
  voice_keeper: config/agents/voice_keeper.md

documents:
  - label: campaign_state
    path: docs/campaign_state.md
  - label: world_state
    path: docs/world_state.md
  - label: mechanics
    path: docs/mechanics.md
  - label: planning
    path: docs/planning.md
  - label: party
    path: docs/party.md

# Wing names are campaign-specific and MUST match .mneme/mempalace.yaml.
#
# Kept byte-identical to the stanza in the legacy root config.yaml on purpose.
# Two subsystems disagree about which file to read:
#   - pipelines/rlm/mcp_server.py:51 prefers campaign_dir/config.yaml and only
#     falls back to this one
#   - server/platform_config_service.py:420 reads this one directly
# So if the two files drift, the two subsystems drift with them.
#
# Omitting the stanza is not an error and will not fail loudly — mcp_server.py:77
# defaults index_wings to ["chronicle", <campaign-dir-name>]. "chronicle" is not
# an obelisk wing (it belongs to out-of-the-abyss and toee), so search would
# quietly drop notes/ and summaries/ and return thin results instead of erroring.
mempalace:
  canon_wing: narrative
  index_wings:
    - notes
    - summaries
    - obelisk
