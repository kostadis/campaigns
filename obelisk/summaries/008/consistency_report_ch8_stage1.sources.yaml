    CORRECTION TO THE REPORT (s1-02, the report's own "most serious mechanical
    error"). The report told us to strip Thunderwave from Zenvon on the grounds
    that "an Arcane Trickster gains no leveled spell slots and no evocation
    spells at 3rd level; Thunderwave is not on the Arcane Trickster list at all."
    All three claims are false: a Rogue 3 Arcane Trickster has two 1st-level
    slots, draws from the wizard list, and may take one spell from any school at
    3rd level. The tape confirms Zenvon cast it - Recording.cleaned.md:1497
    "All right, Zenvon, you're up first", then the caster is asked "do you wanna
    try it on these two bugbears? You wanna include the goblin or not?" and
    answers "I don't wanna include the goblin"; at 1591 Nikhil says "so I'm gonna
    use the thunderwave"; the GM then walks him through HIS OWN sheet ("if you go
    over in your spells, spell DC is a 12... Now go click on Thunderwave").
    The Summary and Scenes were right; the Spells section was the stale side.

    CORRECTION TO THE REPORT (s1-06 direction). The report suggested the recap's
    250 gp might need correcting to the module's 200. Recording.cleaned.md:2697 -
    "So it was, uh, 250 gold pieces for eliminating the Redbrand threat and
    finding Iarno." The recap is right; only the recording of the deviation was
    missing. The three-tier Iarno bounty is verbatim at 2737.

    CORRECTION TO THE REPORT (s1-03, a footer false-clearance). The report's
    "verified as correct" footer cleared "Miner's Exchange under the Lionshield
    Coster - consistent with canon's Phandalin geography." No grounding doc says
    it. Raw VTT 02:42:24-02:42:44: "Do you see the Miner's Exchange?" / "There,
    she says now." / "It's under the Lionshield Coster." / "You see it?" /
    "Yeah, I see that." That is a where-to-look cue for a map token. The GM uses
    the same construction at Recording.cleaned.md:2829 for quest-list position.

    NEAR-MISS AVOIDED (potions). The Zoom .md has the chest containing "a potion
    of viewing, a potion of climbing, and a potion of growth" - which would have
    made the recap's chest-sourced healing potion an error. The raw Whisper VTT
    line 2888 has "A potion of healing, a potion of climbing, and a potion of
    growth", and 5etools adventure-pabtso.json agrees. "Viewing" is a Zoom-ASR
    garble. The recap was right; only its Summary phrasing was ambiguous.

    NEAR-MISS AVOIDED (Thundertree). The Zoom .md has Mirna fleeing "after the
    Owlbear overran the place", which would have made the recap's "undead" a
    fabricated quote. Raw VTT 1659 has "after the own dead overran the place" -
    ASR for "undead". The recap was right.

    5ETOOLS VERIFICATION (s1-01, s1-09), per the GM's standing instruction.
    No .mcp.json exists in this workspace, so the 5etools MCP server is NOT
    registered here and mcp__campaign__rpg_search returned
    fivetools_candidates_seen: 0 with fallback_reason "wing indices empty".
    Verified instead against the canonical data on disk,
    /home/kroussos/src/5etools-src/data/adventure/adventure-pabtso.json:
      - "Scraptops" occurs EXACTLY ONCE in the whole adventure, in R9:
        "He is a member of the Scraptops, a goblin clan known for its scavenging
        and tinkering." "Sawplee" occurs 29 times, as Ruxithid's psionic-goblin
        faction. They are unambiguously distinct, and the GM's table utterance
        of "Sawplee" for Droop's clan was a slip.
      - Dead Goblins (R8): "Underneath the southern bridge are corpses of two
        psionic goblins... elongated skulls... filthy, haphazard rags."
        There is exactly ONE such set in the hideout, and it is at the crevasse.
        So world_state.md's "hideout caverns in Ch. 6" and the recap's "in the
        crevasse" describe the SAME corpses at different levels of precision -
        not two sets, and not a contradiction. No edit made.
      - Thel Dendrar's skeleton and the unicorn-head pendant are confirmed at
        the bottom of the crevasse, and Mirna can identify them.

    BUGBEAR COUNT (s1-08). Four bugbears (module R9 and the read-aloud). Only one
    death anywhere in the session: Recording.cleaned.md:2003 "so it causes five
    points of damage, so this guy dies" / "So they don't die from the fire?" /
