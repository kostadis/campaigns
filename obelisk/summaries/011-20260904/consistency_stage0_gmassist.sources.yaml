    reviewed_by: GM
    reviewed: "2026-09-05"
    gm_rulings_this_run:
      - "Warden is the Kost Wardens' collective TITLE; the acolyte is Warden Holl, distinct from Warden Dreth who leads the twelve. Recap prose uses the full name; the verbatim quote is left as spoken with an editorial note."
