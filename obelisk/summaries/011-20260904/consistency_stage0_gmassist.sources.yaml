    applied:
      - { finding: 1, fix: "Brugor -> Brughor, 12 occurrences in gm-assist.md incl. the NPC section heading and Gog's quoted line. Corroborated by prep (Brughor x17, Brugor x0), PaBTSO ch.3 'Raider Camp', the registry alias, and the same-day glossary ruling." }
      - { finding: 9, fix: "Removed the duplicate 'The remaining bugbears... flee the cave one by one' bullet from the Battle Against Gog scene, and changed 'bugbear sentries' to 'the four bugbears inside' in the Ambush scene. NOTE: this is the OPPOSITE of the report's suggested fix — see vtt_adjudicated." }
      - { finding: 3, fix: "Warden -> Warden Holl in Summary (x2), dinner-scene bullet, NPC heading and NPC blurb. The Memorable Moments quote left VERBATIM with an italic editorial note explaining title-vs-name." }
      - { finding: 4, fix: "Added an explicit statement to the Summary and the dinner scene that the session ended without Hamun handing over the route, and that the party has the name but no road." }
      - { finding: 5, fix: "Recap left as written (GM ruled the gemstones are table canon). Propagated INTO docs/entity_registry.yaml (Talon note), docs/world_state.md:128 and docs/campaign_state.md (lines 21, 89, 96) so the grounding docs agree." }
      - { finding: 8, fix: "Added a dinner-scene bullet recording that Harbin Wester's 120 gp bounty on the same marauders is now collectible." }
    rejected:
      - finding: 2
        ruling: "Recap is accurate; do not change five to three."
        rationale: >-
          Tape: the sentry is dead (cue 1635 'the bug beer is dead') and the body hidden
          (cue ~1690) BEFORE the GM looks inside and says 'There's 4 bugbeers, there's an
          ogre' (cue 1867). Cue 3083 repeats 'these four bugbears, and this ogre'. The GM
          ran five bugbears total. Applying the suggested fix would have falsified the recap.
      - finding: 6
        ruling: "Table ruling, not a rules error."
        rationale: >-
          True Strike was used at the table: cue 3155 'I wanna use the spell Truestrike'
          and cue 3263 'Hold on, I mean... True strike, okay.' The GM allowed it.
          The grounding docs are stale, not the recap — see carry_forward.
      - finding: 7
        ruling: "Recap accurate to the table; enrichment declined."
        rationale: >-
          The table cited Sildar explicitly — cue 4103 'Remember what Sildar told us?' and
          cue 4143 'This is what Sildar told you when he was captured.' Adding the Ch. 6
          elongated-skull goblins would be campaign knowledge the table did not invoke.
      - finding: 10
        ruling: "Blurb is defensible; leave it."
        rationale: >-
          The tape shows both sides. Compassion at cues 1663 / 2511 / 2519, and cold
          pragmatism at cue 3803 'sounds good to me. I never liked ogres.'
      - finding: 11
        ruling: "Do not name the sentry."
        rationale: >-
          No bugbear name — Hul, Skarn, Gorra or Muk — is spoken anywhere on the tape.
          The prep names them; the party never learned any of them. Module truth is not
          party knowledge, and naming him would have written an unearned name into canon.
      - finding: 12
        ruling: "GM ruled it explicitly at the table."
        rationale: >-
          Cue 2143: 'so it's... 5 foot cube means it could be the shape of a bugbear. So you
          could create a bugbear image...' and cue 2107 'the illusion, I believe, is
          stationary' — which is exactly what the recap says. The GM outranks RAW here.
  vtt_adjudicated: |
    Transcript consulted BY HAND (not passed as --context):
    summaries/011-20260904/GMT20260904-220136_Recording.transcript (1).cleaned.vtt

    THE REPORT POINTED AT THE WRONG HALF OF FINDING 9. It recommended aligning the
    Summary to the Scenes section ("mid-fight flight matches the scene beats"). The
    tape says the reverse. Sequence:
      cue 2791  Nikhil: "Okay, I'll let the bugbears, run away then."
      cue 2839  GM: "the bugbears get the point... The ogre is kind of pissed off,
                calling them a bunch of cowards, and... his beloved [Brughor]"
      cue 2915  GM: "And it falls on his head. The ogre howls."
      cue 2919  GM: "A mini dog, you kill, Brughor, me eat you alive."
      cue 3059  GM: "Gog. It's Gog's turn now, isn't it?"   <- the Gog FIGHT starts here
    The bugbears fled BEFORE the Gog fight. The Summary was right; the Scenes section
    was wrong. Fixed in the direction the tape indicates.

    Six of twelve findings were overturned or redirected by the tape (2, 6, 7, 9, 11, 12).
    None of the six were settleable from grounding docs — the facts involved (how many
    bugbears the GM actually ran, whether a spell was permitted, whether a name was
    spoken aloud, which half of a contradiction is true) appear in no grounding doc.

    Finding 3 evidence — cue 4731: "My, my, my, my, my, my, what is it, my apprentice
    warden is serving me so much better in death than he served me in life." Lower-case
    'warden' on the tape; genuinely ambiguous between title and given name. Taken to the
    GM rather than ruled. Cue 4743: "He told you who he was, his apprentice."

    Finding 5 evidence — cue 5015 is NIKHIL, not the GM: "Made with... forged with
    diamonds and all the other precious stones." A player's characterisation that the
    recap had recorded as an established item property. GM elevated it to table canon.

    Finding 4 evidence — searched every cue after 4459 ("do you wanna head back to Hamun
    and then, get the information about Cragmaw Castle?"). No handover anywhere; the
    session ends on out-of-character tactical debrief.

    Finding 8 evidence — cue 2099: "it's a good thing that Harbin Wester was gonna give
    us some money." Harbin WAS named at the table, so the omission was real.
