version: 1
campaign: obelisk
entities:
- name: Daran Edermath
  type: npc
  aliases:
  - Daran
  provenance: module
  source: docs/background/obelisk.md
  note: Phandalin NPC who sends the party to investigate Old Owl Well, rewarding them
    with boots of striding and springing. [intro–ch3]
- name: Gundren Rockseeker
  type: npc
  aliases:
  - Gundren
  provenance: module
  source: docs/background/obelisk.md
  note: Dwarf whose map led to Wave Echo Cave; ambushed on Nezznar's orders; later
    helps administer the reclaimed mine alongside brother Nundro. [intro–ch4]
- name: Gwyn Oresong
  type: npc
  aliases:
  - Gwyn
  provenance: module
  source: docs/background/obelisk.md
  note: Phandalin ally who identifies the infected townspeople's obelisk exposure,
    suspects an elder brain beneath town, and names Illithinoch as the stronghold.
    [intro, ch1, ch2, ch5, ch6, ch7, ch8]
- name: Iarno "Glasstaff" Albrek
  type: npc
  aliases:
  - Albrek
  - Glasstaff
  - Iarno
  - Iarno Albrek
  - Lord Albrek
  provenance: module
  source: docs/background/obelisk.md
  note: Human wizard and Lords' Alliance agent who disappeared in Phandalin; secretly
    leads the Redbrands as "Glasstaff," taking orders from the Spider. [intro, ch1,
    ch2, ch3, ch8, app]
- name: King Grol
  type: npc
  aliases:
  - Grol
  provenance: module
  source: docs/background/obelisk.md
  note: Leader of the Cragmaw goblins, dwelling in Cragmaw Castle; ordered the capture
    of Gundren Rockseeker on the Spider's behalf. [intro, ch1, ch3]
- name: Nezznar the Spider
  type: npc
  aliases:
  - Nezznar
  - Spider
  - The Spider
  - the drow
  provenance: module
  source: docs/background/obelisk.md
  note: Drow villain who ambushed Gundren, captured Tharden and Nundro, and explores
    Wave Echo Cave seeking the Forge of Spells; uses Cragmaw goblins and Redbrands.
    [intro, ch1, ch2, ch3, ch4, ch8, app]
- name: Qunbraxel
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Mind flayer warlock coordinating the fanatics' obelisk retrieval at Gibbet
    Crossing; the party typically confronts and defeats him there (ch1 intro foreshadowing,
    ch7 references him as dead). [intro, ch1, ch6, ch7, ch8, app]
- name: Ruxithid the Chosen
  type: npc
  aliases:
  - Ruxithid
  - the Chosen
  provenance: module
  source: docs/background/obelisk.md
  note: Psionic goblin leading the Sawplee goblins from Zorzula's Rest; in psychic
    communication with mind flayer fanatics seeking obelisk pieces. [intro, ch1, ch3,
    ch5, ch6, ch8, app]
- name: Sildar Hallwinter
  type: npc
  aliases:
  - Sildar
  - Hallwinter
  provenance: module
  source: docs/background/obelisk.md
  note: Human warrior escorting Gundren Rockseeker to Phandalin; captured and held
    by the Cragmaws; Lords' Alliance agent from Waterdeep's griffon cavalry. [intro,
    ch1, ch2, ch3, ch4, ch8, app]
- name: Elmina Barthen
  type: npc
  aliases:
  - Barthen
  - Elmina
  provenance: module
  source: docs/background/obelisk.md
  note: Owner of Barthen's Provisions in Phandalin; informs the characters that Gundren
    Rockseeker never arrived and recounts the goblin troubles. [ch1, ch2, ch5]
- name: Errk
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Goblin boss in the Cragmaw hideout who shouts supportively alongside Yeemik;
    carries a belt pouch containing 21 cp. [ch1]
- name: Klarg
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Bugbear leader of the Cragmaw hideout who reports to King Grol; delusional
    self-styled king with a pet wolf named Ripper. [ch1]
- name: Linene Graywind
  type: npc
  aliases:
  - Linene
  provenance: module
  source: docs/background/obelisk.md
  note: Of the Lionshield Coster; can provide information on the goblin attacks and
    seeks recovery of goods stolen by Klarg. [ch1–ch2]
- name: Nundro Rockseeker
  type: npc
  aliases:
  - Nundro
  provenance: module
  source: docs/background/obelisk.md
  note: Dwarf commoner, youngest Rockseeker brother, held prisoner and interrogated
    by Nezznar in area W20; once rescued, he helps administer the reclaimed mine.
    [ch1–ch4]
- name: Tharden Rockseeker
  type: npc
  aliases:
  - Tharden
  provenance: module
  source: docs/background/obelisk.md
  note: Dwarf brother of Gundren, killed by Nezznar and left dead at the Rockseekers'
    campsite (area W1); his cloak of protection remains there. [ch1–ch4]
- name: Yeemik
  type: npc
  aliases:
  - Yimek
  provenance: module
  source: docs/background/obelisk.md
  note: Goblin boss and second-in-command of the Cragmaw hideout; tries to oust Klarg
    and holds Sildar hostage to bargain with the party. [ch1]
- name: Agatha
  type: npc
  aliases:
  - the banshee Agatha
  provenance: module
  source: docs/background/obelisk.md
  note: Banshee, formerly a female elf, lairing near Conyberry; answers one question
    truthfully if approached respectfully and given a gift. [ch2–ch3]
- name: Aldith Tresendar
  type: npc
  aliases:
  - Sir Aldith
  - the Black Hawk
  provenance: module
  source: docs/background/obelisk.md
  note: Great knight known as the Black Hawk who died fighting bandits below his manor;
    former owner of the sword Talon. [ch2]
- name: Ander
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Young clerk from Phandalin's general store, infected by obelisk-shard exposure
    via the store's well, turned violent alongside Garaele and Halia. [ch2, ch5, ch6,
    ch7, ch8]
- name: Bowgentle
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Author of a spellbook once possessed by Agatha, who traded it to the necromancer
    Tsernoth over a century ago. [ch2–ch3]
- name: Carp Alderleaf
  type: npc
  aliases:
  - Carp
  provenance: module
  source: docs/background/obelisk.md
  note: Halfling friend of Pip who isn't allowed to venture far from Alderleaf Farm;
    points the characters toward where Pip went into the hills. [ch2, ch6]
- name: Droop
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Goblin of the Scraptops clan, bullied by the bugbears in the guard barrack;
    wants only to go home. [ch2]
- name: Elsa
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Gwyn Oresong's sister, a bartender at the Stonehill Inn who told Gwyn about
    the recent Phandalin crimes. [ch2, ch5]
- name: Freda
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Gnome weaver at the Stonehill Inn who shares a rumor about Halia Thornton
    and the Miner's Exchange. [ch2]
- name: Grista
  type: npc
  aliases:
  - Greska
  provenance: module
  source: docs/background/obelisk.md
  note: Dwarf owner of the Sleeping Giant tavern in Phandalin, whose cellar hides
    the sinkhole leading down toward Illithinoch. [ch2, ch5, ch6, ch7]
- name: Halia Thornton
  type: npc
  aliases:
  - Guild Master Halia
  - Halia
  provenance: module
  source: docs/background/obelisk.md
  note: Runs the Miner's Exchange in Phandalin; recruits characters (especially Zhentarim
    recruits) to find her four missing miners in the Sword Mountains. [ch2, ch4, ch5,
    ch6, ch7, ch8]
- name: Harbin Wester
  type: npc
  aliases:
  - Harbin
  - Townmaster Harbin Wester
  - townmaster
  - Wester
  provenance: module
  source: docs/background/obelisk.md
  note: Townmaster of Phandalin who hires the characters to investigate goblin crimes;
    too frightened to act alone. [ch2, ch3, ch5]
- name: Lanar
  type: npc
  aliases:
  - Lenar
  provenance: module
  source: docs/background/obelisk.md
  note: Human miner at the Stonehill Inn who shares a rumor about marauders on the
    Triboar Trail. [ch2]
- name: Mirna Dendrar
  type: npc
  aliases:
  - Mirna
  provenance: module
  source: docs/background/obelisk.md
  note: Family once ran Thundertree's herbalist shop; now a resident of Phandalin
    who may have sent the party to find a hidden heirloom. [ch2–ch3]
- name: Nars
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Mirna Dendrar's thirteen-year-old son, held captive by the Redbrands in the
    holding cells. [ch2]
- name: Narth
  type: npc
  aliases:
  - Old Narth
  provenance: module
  source: docs/background/obelisk.md
  note: Human farmer at the Stonehill Inn who shares a rumor about Sister Garaele's
    wounding. [ch2, ch6]
- name: Nilsa
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Mirna Dendrar's eighteen-year-old daughter, held captive by the Redbrands
    in the holding cells. [ch2]
- name: Nosk
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Bugbear leader of the group the Spider sent to reinforce the Redbrands; carries
    a key to the hideout. [ch2]
- name: Qelline Alderleaf
  type: npc
  aliases:
  - Qelline
  provenance: module
  source: docs/background/obelisk.md
  note: Wise, pragmatic halfling farmer who knows Phandalin's happenings; her son
    Carp found the Redbrands' secret tunnel. [ch2–ch3]
- name: Reidoth
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Druid and longtime friend of Qelline Alderleaf who knows the land well and
    recently traveled to Thundertree. [ch2–ch3]
- name: Sister Garaele
  type: npc
  aliases:
  - Garaele
  provenance: module
  source: docs/background/obelisk.md
  note: Acolyte of the Shrine of Luck infected by obelisk-shard exposure; fights Halia
    Thornton and Ander before townspeople restrain the trio. [ch2, ch3, ch5, ch6,
    ch7, ch8]
- name: Thel Dendrar
  type: npc
  aliases:
  - Thel
  provenance: module
  source: docs/background/obelisk.md
  note: Local woodcarver murdered by the Redbrands after standing up to them; his
    skeleton lies in the crevasse cave. [ch2]
- name: Thistle
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: One of Elmina Barthen's two clerks at Barthen's Provisions. [ch2]
- name: Toblen Stonehill
  type: npc
  aliases:
  - Toblen
  provenance: module
  source: docs/background/obelisk.md
  note: Along with Trilena Stonehill, asks the characters to search the fields for
    their missing ten-year-old son, Pip. [ch2, ch5, ch6]
- name: Urmon
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Adventurer whose Dwarvish journal in Glasstaff's workshop records the lost
    mine of Phandelver and the mace Lightbringer. [ch2]
- name: Brughor Axe-Biter
  type: npc
  aliases:
  - Brughor
  provenance: module
  source: docs/background/obelisk.md
  note: Orc raider leader occupying Wyvern Tor's cave with 18 hit points; his band
    flees if he is killed. [ch3]
- name: Dresina
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Wizard who built the tower at Old Owl Well long ago; name revealed only by
    Agatha in answer to Hamun Kost's question. [ch3]
- name: Favric
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Ambitious young human cultist leader in Thundertree who plans to offer the
    party to Venomfang as tribute to earn its trust. [ch3]
- name: Gog
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Ogre among Brughor Axe-Biter's raiders at Wyvern Tor who fights until slain.
    [ch3]
- name: Hamun Kost
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Human mage and Red Wizard of Thay exploring Old Owl Well; trades information
    for favors regarding Wyvern Tor and Agatha. [ch3]
- name: Lhupo
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Goblin boss styling herself a priest at Cragmaw Castle's goblin shrine; owns
    a pet grick guarding the Dark Hall. [ch3]
- name: Palien
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Old hero of Neverwinter depicted in a weathered statue at Thundertree's Town
    Square; supposedly defeated monsters when the town was founded. [ch3]
- name: Tsernoth
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Necromancer from Iriaebor who received Bowgentle's spellbook from Agatha in
    a trade over a century ago; fate unknown. [ch3]
- name: Vyerith
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Doppelganger disguised as a drow woman, messenger from the Spider sent to
    collect Gundren Rockseeker and the map to Wave Echo Cave. [ch3]
- name: Yegg
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Cantankerous goblin boss who cooks for the Cragmaws in Cragmaw Castle's Banquet
    Hall; his death sends surviving goblins fleeing. [ch3]
- name: Mormesk the Wraith
  type: npc
  aliases:
  - Mormesk
  - the wraith
  provenance: module
  source: docs/background/obelisk.md
  note: Restless spirit of the last wizard to die in the mine's spell battle; leads
    Wave Echo Cave's Undead and guards treasure he cannot touch. [ch4]
- name: Tergon
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Human hero of old Neverwinter for whom an enchanted breastplate with a gold
    dragon motif was created. [ch4]
- name: Vhalak
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Doppelganger who disguises itself as a drow supervisor overseeing Nezznar's
    bugbears in area W18, digging for treasure in a collapsed rift. [ch4]
- name: Dareth Grint
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Human farmer, Harbin Wester's second cousin, held hostage and left to starve
    in the Indigo Sanctum's hostage room. [ch5]
- name: Hjoldak Hollowhelm
  type: npc
  aliases:
  - Hjoldak
  provenance: module
  source: docs/background/obelisk.md
  note: Neutral duergar, last mining captain of Zorzula's Rest, his soul imprisoned
    by mind flayers in a murmuring jar. [ch5]
- name: Paulina Previne
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Human stable hand who occasionally works at the Stonehill Inn, held hostage
    in the Indigo Sanctum. [ch5]
- name: Tamara Stonehill
  type: npc
  aliases:
  - Tamara
  provenance: module
  source: docs/background/obelisk.md
  note: Ten-year-old daughter of Toblen Stonehill; witnessed goblins steal the Shrine
    of Luck's centerpiece and helps rebuild it. [ch5]
- name: Trilena Stonehill
  type: npc
  aliases:
  - Trilena
  provenance: module
  source: docs/background/obelisk.md
  note: Tamara Stonehill's mother, a worshiper of Tymora who witnessed the Shrine
    of Luck's collapse and helps Sister Garaele. [ch5–ch6]
- name: Tumblewick Rollins
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Gnome apothecary held hostage in the Indigo Sanctum by the Sawplee goblins.
    [ch5]
- name: Wheel-of-Fortune
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Tiefling bartender at the Sleeping Giant undergoing mind-flayer-like transformation
    from a nearby obelisk shard; senses the elder brain and psychic energy. [ch5,
    ch7, ch8]
- name: Zorzula
  type: npc
  aliases:
  - Zorz
  provenance: module
  source: docs/background/obelisk.md
  note: Powerful duergar leader mentioned in history books who commanded mining operations
    in the Sword Mountains; namesake of Zorzula's Rest. [ch5]
- name: Aida Camber
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Kidnapped Phandalin miner, sister of Cathlette Camber, trapped in the grells'
    larder (area J4) awaiting rescue. [ch6–ch7]
- name: Brelta Gemblade
  type: npc
  aliases:
  - Brelta
  provenance: module
  source: docs/background/obelisk.md
  note: Dwarf general instrumental in securing regional peace, laid to rest in the
    crypt's General's Tomb; she and her aides have risen as vengeful ghosts. [ch6]
- name: Cameren
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Galeb duhr companion of the medusa Honna in Talhundereth's Lesser Chapel;
    idolizes her though she barely acknowledges him. [ch6]
- name: Cathlette Camber
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Kidnapped Phandalin miner, engaged to Oskar Ninebough, trapped in the grells'
    larder (area J4) after a goblin-escorted abduction. [ch6–ch7]
- name: Chals
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: One of three Humanoid mutates of the Cult of the Obelisk inhabiting Talhundereth's
    cleansing chamber, alongside Harralie and Paulam. [ch6]
- name: Elise
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Wallin Kreeve's daughter; one of the miners who followed her father into the
    cave and became trapped by the shambling mound. [ch6]
- name: Erdan Vosselth
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: One of three neutral drow who have worked for the Henlifel family as guards
    and laborers, temporarily camped in Talhundereth's reading room. [ch6]
- name: Falfark
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Humanoid mutate of the Cult of the Obelisk living in Talhundereth's private
    rooms with a pet encephalon gemmule he calls a guardian. [ch6]
- name: Fremine
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: One of two galeb duhr disguised as boulders guarding the collapse near Honna's
    chapel in Talhundereth's Deepening Hall. [ch6]
- name: Frowode
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: One of two galeb duhr disguised as boulders guarding the collapse near Honna's
    chapel in Talhundereth's Deepening Hall. [ch6]
- name: Harralie
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: One of three Humanoid mutates of the Cult of the Obelisk inhabiting Talhundereth's
    cleansing chamber, alongside Chals and Paulam. [ch6]
- name: Honna
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Medusa who lairs in Talhundereth's Lesser Chapel, capturing bandits and explorers
    to petrify into kneeling statues that she admires as art. [ch6]
- name: Hovnar Tartesh
  type: npc
  aliases:
  - Hovnar
  provenance: module
  source: docs/background/obelisk.md
  note: Human clerk imprisoned in the Toppled Statue's base with his brother Menvin,
    trying to rally the despairing captives. [ch6, ch8]
- name: Karthim Humblepick
  type: npc
  aliases:
  - Karthim
  provenance: module
  source: docs/background/obelisk.md
  note: Quiet dwarf miner trapped in Hardyhammer Mine; thanks the characters if rescued
    and knows of treasures in Talhundereth's vault and crypt. [ch6]
- name: Malinia
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Humanoid mutate of the Cult of the Obelisk defacing a statue of Dumathoin
    in Talhundereth, aided by four encephalon gemmules. [ch6]
- name: Marthungrim
  type: npc
  aliases:
  - Marthungrim the Valiant
  provenance: module
  source: docs/background/obelisk.md
  note: Dead dwarf paladin of Dumathoin who excavated his home, sought to destroy
    the crypt's restless ghosts, and died of wounds from tentacled creatures. [ch6]
- name: Menvin Tartesh
  type: npc
  aliases:
  - Menvin
  provenance: module
  source: docs/background/obelisk.md
  note: Human clerk imprisoned in the Toppled Statue's base, brother of Hovnar, nearly
    comatose with despair. [ch6, ch8]
- name: Mildra Merkel
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Orc farmer imprisoned in the Toppled Statue's base among the four rescued
    Phandalin townspeople. [ch6, ch8]
- name: Murnig
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Loyal aide of General Brelta Gemblade, laid to rest beside her in the crypt;
    has returned from the dead as a ghost. [ch6]
- name: Nalpina Goldstone
  type: npc
  aliases:
  - Nalpina
  provenance: module
  source: docs/background/obelisk.md
  note: Dwarf traveling inventor imprisoned in the Toppled Statue's base who speaks
    some Deep Speech and overheard the mind flayers' plans. [ch6, ch8]
- name: Nelja
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Loyal aide of General Brelta Gemblade, laid to rest beside her in the crypt;
    has returned from the dead as a ghost. [ch6]
- name: Nythalyn Henlifel
  type: npc
  aliases:
  - Nythalyn
  provenance: module
  source: docs/background/obelisk.md
  note: Drow elite warrior, son of Ontharyx; with his brother Yanthdel, leads drow
    retainers in Talhundereth hoping to convince their father to return home. [ch6]
- name: Ontharyx
  type: npc
  aliases:
  - Ontharyx Henlifel
  provenance: module
  source: docs/background/obelisk.md
  note: Leader of the Cult of the Obelisk in Talhundereth; abandoned his family, and
    his sons Nythalyn and Yanthdel hope to bring him home. [ch6]
- name: Oskar Ninebough
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Kidnapped Phandalin sawyer with an old leg injury, trapped with Cathlette
    and Aida Camber in the grells' larder after their goblin captors fled. [ch6–ch7]
- name: Paulam
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: One of three Humanoid mutates of the Cult of the Obelisk inhabiting Talhundereth's
    cleansing chamber, alongside Chals and Harralie. [ch6]
- name: Rivibiddel
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Elderly svirfneblin trapped in the Crypt of the Talhund copying 'He of the
    Hidden Gemstone'; aged by ghosts' Horrifying Visage and needs rescue. [ch6–ch8]
- name: Shansa
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Elf wife of Thawnia Browne imprisoned in the Crystal Dome; worries the mind
    flayers will return to torment the captives. [ch6, ch8]
- name: Thawnia Browne
  type: npc
  aliases:
  - Thawnia
  provenance: module
  source: docs/background/obelisk.md
  note: Human farmer imprisoned in the Crystal Dome with her wife Shansa; holds out
    hope that other lost townspeople escaped. [ch6, ch8]
- name: Thiala Sharne
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: One of three neutral drow who have worked for the Henlifel family as guards
    and laborers, temporarily camped in Talhundereth's reading room. [ch6]
- name: Thorgran Ironquill
  type: npc
  aliases:
  - Thorgran
  provenance: module
  source: docs/background/obelisk.md
  note: Dwarf historian who faked his death centuries ago to investigate mind flayer
    activity; his corpse is now puppeted by a cloaker mutate. [ch6–ch7]
- name: Unmiel
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Newly engaged elf laborer imprisoned in the Crystal Dome among the four rescued
    Phandalin townspeople. [ch6, ch8]
- name: Vakketar
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Chain devil bound in Gibbet Crossing's prison (area G6) by duergar diabolists;
    survived the mind flayers' attack and lures intruders into spiked cages. [ch6]
- name: Vellios Keethe
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: One of three neutral drow who have worked for the Henlifel family as guards
    and laborers, temporarily camped in Talhundereth's reading room. [ch6]
- name: Verno Tharbun
  type: npc
  aliases:
  - Verno
  provenance: module
  source: docs/background/obelisk.md
  note: Human miner who returned to town describing a 'walking shrub' that lured Wallin
    Kreeve into a cave; the others followed him. [ch6]
- name: Wallin Kreeve
  type: npc
  aliases:
  - Wallin
  provenance: module
  source: docs/background/obelisk.md
  note: Old miner lured by a shambling mound (disguised as a strange walking shrub)
    into a cave in the Sword Mountains, then trapped there. [ch6]
- name: Wramble
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Gnome wainwright imprisoned in the Crystal Dome with his capybara mount Violet;
    counted the mind flayers' obelisk fragments. [ch6, ch8]
- name: Yanthdel Henlifel
  type: npc
  aliases:
  - Yanthdel
  provenance: module
  source: docs/background/obelisk.md
  note: Drow elite warrior, son of Ontharyx; speaks Dwarvish in addition to Elvish,
    Undercommon, and Common, and offers his periapt of health as reward. [ch6]
- name: Zoklork
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Xorn lairing in Gibbet Crossing's toppled tower room (area G14) with two earth
    elementals, seeking amethysts a roper ambush stole from its dead rockmate. [ch6]
- name: Zuluthl
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Yochlol summoned by House Azfadiel's priests to guard their shrine (area G20);
    has remained ever since and reacts violently to intruders. [ch6]
- name: Ahooshathan
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Mind flayer running Illithinoch's Experimentation Chamber with two nothics;
    surrenders and shares information about the fanatics and Far Realm rifts if outmatched.
    [ch7]
- name: Chishinix
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: One of three mind flayer fanatics performing Ilvaash's ritual; accompanied
    by a severed head, she stalls and negotiates with intruders at Anima Entry. [ch7–ch8]
- name: Duoro Engletor
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Aberrant zealot instructing Larnon Veddin in Ilvaash's worship at Illithinoch's
    feeding pool; a former Far Realm scholar exiled from Neverwinter. [ch7]
- name: Golcuus
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Beholder who built the Labyrinth of Eyes' viewing rods; peered into the Briny
    Pool and was later warped by the fanatics into a miserable oculorb. [ch7–ch8]
- name: Gulguush
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Mind flayer prophet and ardent follower of Chishinix who guards her room with
    a homunculus and writes a prayer book devoted to Ilvaash. [ch7]
- name: Hashutu
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Self-indulgent mind flayer fanatic whose hands Ilvaash replaced with warning
    tentacles after his paranoia about enemies; keeps a lavish room. [ch7–ch8]
- name: Larnon Veddin
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Human cult fanatic being instructed in Ilvaash worship by Duoro Engletor;
    slower to give up his humanity than his mentor. [ch7]
- name: Oshundo the Alhoon
  type: npc
  aliases:
  - Oshundo
  provenance: module
  source: docs/background/obelisk.md
  note: Arrogant alhoon guest of Voalsh who aided the fanatics with old Underdark
    knowledge; was driven from Illithinoch long ago for using arcane magic. [ch7–app]
- name: Shalghast
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Mind flayer who guards Illithinoch's Reception Hall with Ulthundul, questioning
    visitors about worship of Ilvaash or obelisk deliveries. [ch7]
- name: Ulthundul
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Mind flayer guard in Illithinoch's Reception Hall who casts detect thoughts
    on visitors alongside Shalghast. [ch7]
- name: Voalsh
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Mind flayer fanatic granted wings by Ilvaash after being ambushed by rival
    illithids; hovers on a floating disk to intimidate. [ch7–ch8]
- name: Ablinash
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Mind flayer zealot of Ilsensine who forsook that deity for Ilvaash and became
    its first follower; had a mutant human mouth. [ch8]
- name: Ashripask
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Arcanaloth Nellik's mezzoloth unit formerly served, leading them into dangerous
    Far Realm locales; they fled while it slept into the Briny Pool. [ch8]
- name: Charnyz
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Spirit naga lurking in the Mire of Doubt who tests intruders with an illusory-snake
    challenge; fights to the death alongside Valsyx. [ch8]
- name: Frevvik
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Wary mezzoloth adjutant to Nellik who keeps watch at Nellik's Windmill and
    blows a war horn to summon patrols. [ch8]
- name: Ghaluzesh
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Kraken who directs Ilvaash's brain breaker squads against the characters while
    lairing invulnerably in the Shallows of Sudden Thought. [ch8]
- name: Gossa
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Lawful neutral human mage sheltering with Lowarnizel in the Briny Maze after
    an errant plane shift spell stranded them. [ch8]
- name: Groushim
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Aberrant zealot collecting defective items for Ilvaash's junk room; recently
    returned from a Material Plane assassination mission. [ch8]
- name: Jitterjaws
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Loyal flesh meld gifted to Shalfi by Ilvaash; gnaws Shalfi's dig-hole wider
    and fights to the death beside him. [ch8]
- name: Jomlus
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Spectator who reads Klaudel Kamven's tome aloud, endlessly repeating its mispronounced
    text as an obsession inherited from him. [ch8]
- name: Kianka
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Githyanki warrior serving under Varakkta, camped with her in area B7 of the
    Briny Maze. [ch8]
- name: Klaudel Kamven
  type: npc
  aliases:
  - Klaudel
  provenance: module
  source: docs/background/obelisk.md
  note: Sage who sought to understand Truths of the Inward Facing Mind via Jomlus;
    died and was absorbed into the Briny Maze's walls. [ch8]
- name: Lowarnizel
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Young amethyst dragon hiding in the Briny Maze with his companion Gossa after
    an errant plane shift spell stranded them. [ch8–app]
- name: Mublinesh
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Beholder guarding Ilvaash's domain, hoping to earn a lair of its own by slaying
    100 intruders; has already killed 96. [ch8]
- name: Nellik
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Nycaloth commanding a rebel mezzoloth band on the Wailing Battlefield, fled
    her former boss Ashripask; wields the magic greataxe Flayer Slayer. [ch8]
- name: Nouashu
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Aberrant zealot collecting defective items for Ilvaash's junk room; recently
    returned from a Material Plane assassination mission. [ch8]
- name: Shalfi Lewin
  type: npc
  aliases:
  - Shalfi
  provenance: module
  source: docs/background/obelisk.md
  note: Chaotic evil musician-zealot of Ilvaash digging through the Briny Maze's floor
    to reach and kill the dragon Lowarnizel below. [ch8]
- name: Valsyx
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Spirit naga lurking in the Mire of Doubt who stalls intruders with a false
    riddle to let Charnyz arrive; fights to the death. [ch8]
- name: Varakkta
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Githyanki knight leading a scouting party trapped in the Briny Maze; lost
    her prized silver greatsword to an intellect snare in area B5. [ch8]
- name: Vazzi
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Githyanki warrior serving under Varakkta, camped with her in area B7 of the
    Briny Maze. [ch8]
- name: Vecna
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Evil wizard who stole the Weavers' obelisk secrets and erased knowledge of
    them from existence, scattering the lore worldwide. [ch8]
- name: Wise Borblish
  type: npc
  provenance: module
  source: docs/background/obelisk.md
  note: Flumph who believes the nearby encephalon cluster is too powerful for her
    cloister to defeat alone. [ch8]
- name: Dumathoin
  type: deity
  provenance: module
  source: docs/background/obelisk.md
  note: Dwarf deity whose priests, the Talhund, are entombed in the crypt beneath
    Talhundereth; grants a revocable blessing to characters who purify it. [ch4, ch6,
    ch7]
- name: Ilsensine
  type: deity
  aliases:
  - the God-Brain
  provenance: module
  source: docs/background/obelisk.md
  note: Mind flayer deity that Ablinash forsook to instead swear obeisance to the
    discarded divine meninges that became Ilvaash. [intro, ch1, ch5, ch7, ch8]
- name: Ilvaash
  type: deity
  aliases:
  - Dissonant Psyche
  - the Dissonant Psyche
  - the godlet
  provenance: module
  source: docs/background/obelisk.md
  note: Malevolent Far Realm godlet that the three mind flayer fanatics use as a warped
    elder brain, teaching them their ritual requires the obelisk. [intro, ch1, ch5,
    ch6, ch7, ch8]
- name: Lathander
  type: deity
  provenance: module
  source: docs/background/obelisk.md
  note: God of dawn, one of the deities once revered at the shrine decorated in Cragmaw
    Castle's Dark Hall. [ch2–ch4]
- name: Mystra
  type: deity
  provenance: module
  source: docs/background/obelisk.md
  note: God of magic, one of the deities once revered at the shrine decorated in Cragmaw
    Castle's Dark Hall. [ch3]
- name: Oghma
  type: deity
  provenance: module
  source: docs/background/obelisk.md
  note: God of knowledge, one of the deities once revered at the shrine decorated
    in Cragmaw Castle's Dark Hall. [ch3]
- name: the Jagged Tooth
  type: deity
  provenance: module
  source: docs/background/obelisk.md
  note: Made-up god the Cragmaws worship at a shrine in Cragmaw Castle, tended by
    the goblin boss Lhupo. [ch3]
- name: Tymora
  type: deity
  provenance: module
  source: docs/background/obelisk.md
  note: Goddess of luck worshiped at Phandalin's Shrine of Luck, which the Sawplee
    goblins desecrated to steal an obelisk shard. [ch2, ch3, ch5]
- name: Barthen's Provisions
  type: location
  aliases:
  - Barthen's
  provenance: module
  source: docs/background/obelisk.md
  note: Trading post in Phandalin owned by Elmina Barthen; destination for the characters'
    wagonload of supplies, paying 10 gp each. [intro, ch1, ch2, ch5]
- name: Briny Maze
  type: location
  aliases:
  - the maze
  provenance: module
  source: docs/background/obelisk.md
  note: Terrifying fleshy labyrinth in the Far Realm and home of the godlet Ilvaash,
    where the fanatics complete their transformation ritual. [intro, ch1, ch7, ch8]
- name: Cragmaw Castle
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Unlocated goblin stronghold characters may seek to rescue Gundren Rockseeker;
    bugbears in the Redbrands' hideout know its location. [intro–ch3]
- name: Crypt of the Talhund
  type: location
  aliases:
  - the crypt
  provenance: module
  source: docs/background/obelisk.md
  note: Burial crypt beneath Talhundereth holding generations of Dumathoin's priests,
    the Talhund; desecrated and haunted since an ancient mind flayer invasion. [intro,
    ch1, ch5, ch6]
- name: Forge of Spells
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Wave Echo Cave workshop (area W15) where Phandelver Pact wizards enchanted
    dwarven arms and gnome gadgets; guarded by a spectator. [intro, ch1, ch2, ch4]
- name: Forgotten Realms
  type: location
  aliases:
  - the Realms
  provenance: module
  source: docs/background/obelisk.md
  note: High-fantasy world of this adventure, populated by elves, dwarves, halflings,
    humans, and other folk, where the Sword Coast lies. [intro]
- name: Gibbet Crossing
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Abandoned Underdark crossroads holding the third shattered obelisk piece;
    site of the characters' confrontation with the mind flayer Qunbraxel. [intro,
    ch1, ch5, ch6, ch7]
- name: Illithinoch
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Underground stronghold beneath Phandalin where three mind flayer fanatics
    gather the reassembled obelisk to power their Far Realm transformation ritual.
    [intro, ch1, ch6, ch7, ch8]
- name: Material Plane
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: The plane of existence Ruxithid claims his obelisk-shard quest will transform,
    per the mind flayers' deception. [intro, ch1, ch5, ch8]
- name: Neverwinter
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: City to which captured Nezznar could be escorted for interrogation by the
    Lords' Alliance; old Neverwinter was once home to the hero Tergon. [intro–ch5]
- name: Neverwinter Wood
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Forest bordering the Triboar Trail region and Thundertree; Venomfang searched
    it before claiming Thundertree's tower as a lair. [intro–ch3]
- name: Old Owl Well
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Ruined ancient watchtower southeast of Conyberry with a still-fresh well;
    occupied by Hamun Kost and undead guardians. [intro–ch3]
- name: Phandalin
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Surface town above Illithinoch whose townspeople are infected by obelisk-shard
    exposure and whose kidnapped citizens the characters seek to rescue. [intro–ch8]
- name: Sword Coast
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Region of the Forgotten Realms encompassing Phandalin, Neverwinter, and Waterdeep,
    where daring souls delve into fallen strongholds and ancient ruins. [intro–ch3]
- name: Sword Mountains
  type: location
  aliases:
  - Sword Mountain
  provenance: module
  source: docs/background/obelisk.md
  note: Mountain range about 15 miles southwest of Phandalin where four miners scouted
    for a lucrative mining site and were trapped. [intro–ch7]
- name: Talhundereth
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Ancient subterranean dwarven temple to Dumathoin, now ruined and infested
    by the Cult of the Obelisk; contains the Crypt of the Talhund beneath it. [intro,
    ch1, ch5, ch6, ch7, ch8]
- name: The Far Realm
  type: location
  aliases:
  - Far Realm
  provenance: module
  source: docs/background/obelisk.md
  note: Alien plane the mind flayer fanatics fled into through a gateway at Illithinoch,
    worshipped by Ilvaash's followers and reached via three rifts. [intro, ch1, ch5,
    ch6, ch7, ch8]
- name: Thundertree
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Abandoned village near Neverwinter Wood, devastated by Mount Hotenow's eruption
    thirty years ago; now overrun by mutated plants and undead. [intro–ch3]
- name: Toril
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: The world whose surface Ilvaash wants his reestablished mind flayer empire
    to stretch across, starting with Phandalin as its capital. [intro]
- name: Wave Echo Cave
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Lost dwarven mine east of Phandalin in the Sword Mountains, site of the Phandelver
    Pact's treasures; now overrun with monsters and Nezznar's search. [intro–ch6]
- name: Wyvern Tor
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Landmark crag northeast of the Sword Mountains, formerly a wyvern nest, now
    home to Brughor Axe-Biter's orc raiders. [intro–ch3]
- name: Zorzula's Rest
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Underdark site where mind flayers once swept through centuries ago; a grimlock
    retrieved obelisk shards here before the adventurers arrived. [intro, ch1, ch5,
    ch6]
- name: Cave Mouth
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Entrance area (H1) of the Cragmaw hideout, screened by briar thickets, where
    a shallow stream flows from the cave. [ch1]
- name: Cragmaw Hideout
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Goblin lair referenced as where characters may have recovered the Lionshield
    Coster's stolen goods, in its area H8. [ch1–ch2]
- name: Goblin Den
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Common room and barracks (H6) of the Cragmaw hideout where Sildar Hallwinter
    is held prisoner by Yeemik and Errk. [ch1]
- name: Goblin Guard Post
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Goblin lookout post (H2) in the briar thickets east of the hideout's cave
    mouth, manned by goblins and a goblin boss. [ch1]
- name: High Road
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Coastal road the Triboar Trail connects to north of Phandalin; also used by
    Cragmaw raiders for caravan raids. [ch1, ch3]
- name: Kennel
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Chamber (H3) in the Cragmaw hideout where the goblins keep three chained wolves
    they are training for battle. [ch1]
- name: Klarg's Cave
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Klarg's den (H8) in the Cragmaw hideout, holding about 30 days of stolen plunder
    and a hidden treasure chest. [ch1]
- name: Lionshield Coster
  type: location
  aliases:
  - Coster
  provenance: module
  source: docs/background/obelisk.md
  note: Trading post owned by the Lionshields merchant company, run in Phandalin by
    Linene Graywind, who sells armor and weapons. [ch1–ch2]
- name: Overpass
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Cavern (H5) in the Cragmaw hideout with a goblin-guarded rope bridge above
    pools that can be released to flood the tunnel. [ch1]
- name: Steep Passage
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Passage (H4) in the Cragmaw hideout climbing steeply from the cave mouth,
    with a goblin-guarded rope bridge and side passage. [ch1]
- name: Triboar Trail
  type: location
  aliases:
  - The Triboar Trail
  - Triboar Trail Random Encounters table
  provenance: module
  source: docs/background/obelisk.md
  note: Region of foothills and plains between the Sword Mountains and Neverwinter
    Wood, named for the trail running to Triboar. [ch1–ch5]
- name: Twin Pools Cave
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Cavern (H7) in the Cragmaw hideout with two dammed pools the goblins can release
    to flood the passage below. [ch1]
- name: Waterdeep
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: City whose settlers, along with Neverwinter's, founded the resettled frontier
    town of Phandalin in recent years. [ch1–ch2]
- name: Agatha's Lair
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Site, alongside Conyberry, where the banshee Agatha can be found in chapter
    3. [ch2]
- name: Alderleaf Farm
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Farm that halfling Carp Alderleaf isn't allowed to venture far from; he points
    characters toward where he saw Pip go into the hills. [ch2, ch5, ch6]
- name: Conyberry
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Location paired with Agatha's Lair as the chapter 3 destination for Sister
    Garaele's banshee-related quest. [ch2–ch3]
- name: Dragon Coast
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Southern region where Daran Edermath worked for years as a marshal and herald
    before retiring. [ch2]
- name: Edermath Orchard
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Orchard in Phandalin where townspeople notice a strange greenish glow emanating
    from the afflicted cow Daisy. [ch2, ch5, ch6]
- name: Faerûn
  type: location
  provenance: module
  source: docs/background/obelisk.md
  note: Continent the Harpers gather information across in order to thwart tyrants
    and despots. [ch2]
- name: Phandalin Miner's Exchange
  type: location
  aliases:
  - Miner's Exchange
  - The Exchange
  - The Miner's Exchange
  provenance: module
  source: docs/background/obelisk.md
  note: Business run by Halia Thornton in Phandalin; miners' silver stake is payable
    here, and she recruits characters to find missing miners. [ch2, ch5, ch6]
- name: Redbrands' Hideout
  type: location
  aliases:
  - Redbrand Hideout
  - the hideout
  provenance: module
  source: docs/background/obelisk.md
  note: Dungeon complex under Tresendar Manor's cellars, expanded by the Redbrands
    with cells, workshops, and barracks. [ch2]
- name: Stonehill Inn
  type: location
  aliases:
  - The Stonehill Inn
  provenance: module
  source: docs/background/obelisk.md
  note: Newly built roadhouse in central Phandalin run by Toblen Stonehill; the best
    lodging option, where Sildar Hallwinter occupies a room. [ch2, ch5, ch6, ch8]
- name: the North
