- name: Necklace of Fireballs
  type: item
  note: 'FACT (provenance): magic item sealed with the dead wizard in the sarcophagus
    of the Adventurers'' Sepulcher (DIP D7) — a room inside the Dragon Barrow, where
    Lady Alagondar and Azdraka are interred. Seven beads. Retrieved by VUKRADIN in
    ch31; he still carries it. FACT (ownership, GM ruling 2026-08-15, ch48): the necklace
    was LADY ALAGONDAR''S OWN — Boney, who served her in life, attests it on screen
    ("It belonged to Lady Alagondar", re-transcription l.3232; the Zoom capture garbles
    this to "I belong to Lady Alagondar"). The DIP D7 sarcophagus is where it was
    interred and found, not evidence of separate ownership. This strengthens Perrin''s
    claim if his identity is ever established, and it is the basis of Boney''s objection
    that the necklace lay in her tomb — not in any family''s hands — when Perrin''s
    family supposedly lost it to grave robbers. CLAIM (UNVERIFIED, ch46): Ser Kaelen''s
    note names Perrin Alagondar as the rightful owner — "a quiet Alagondar branch,
    no title, no army, a family that lost their dead''s belongings to grave robbers
    a generation ago." Kaelen is relaying a recovery office''s provenance match, not
    first-hand knowledge; the party has verified nothing. Do not record the grave-robber
    story as provenance — it is the claim, and the claim and the provenance are different
    things.'
