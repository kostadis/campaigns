- name: Lord Cassian Meliamne
  type: npc
  aliases:
  - Cassian
  note: Sea elf noble of House Meliamne; COUSIN of Elara Seasong Meliamne — GM ruling
    2026-08-03. The Ch. 47 tape has the Moonstone Mask staff and Cassian himself saying
    "brother"/"his sister"; that was an in-session slip, and campaign_state.md plus
    notes/neverwinter/neverwinter_network.md are canon. The ch47 recap narration was
    corrected to "cousin"; quoted dialogue was left as spoken. Gives the party a description
    of Bimble Nackle that will make players assume it is KP. Received the recovered
    Meliamne statue and paid Cullen Sharpe 200gp over the Harbor Authority writ rather
    than contest it (Ch. 47); asked the party to look for a connection between the
    Displacement Manifold outage and Elara's death.
