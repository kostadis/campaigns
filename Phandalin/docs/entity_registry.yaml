    custody. Distinct from the ch45 Staff of Bird Calls.
- name: Netheril
  type: concept
  source: summaries/20250805-chapter-07/Chapter 07.md
  note: Ancient Faerunian empire; referenced when describing the origin of a god later
    identified as an aspect of Gruumsh (Ch.7)
- name: Tortle
  type: concept
  source: summaries/20250805-chapter-07/Chapter 07.md
  note: Playable race; Soma is a Tortle druid
- name: Crabby
  type: npc
  source: summaries/20250805-chapter-07/Chapter 07.md
  note: Name the party gave the giant intelligent crab at the Tower of Storms; speaks
    Common, was gifted intelligence by the sea elf Miraal and remains loyal to her;
    offers to salvage wrecks (incl. the Star-Crossed Lover) in exchange for laying
    Miraal's spirit to rest
- name: Aldus Hern
  type: npc
  aliases:
  - Aldus
  source: summaries/20260729 (Ch. 47)
  note: Neverember's steward, lion livery. Delivered the Lord Protector's summons
    to the party at the Moonstone Mask (Ch. 47); secret Vukradin fan; invented a daughter,
    Alducia, rather than admit the autograph was for himself. Surname from notes/session_prep/20260616_neverwinter_arrival.md
    ("The steward's name is Aldus Hern"); the table uses the short form.
- name: Cullen Sharpe
  type: npc
  source: summaries/20260729 (Ch. 47)
  note: Associate of House Margaster. Presented a Harbor Authority writ asserting
    a prior salvage claim on the Meliamne statue at the Moonstone Mask and extorted
    200gp from Lord Cassian Meliamne (Ch. 47); then pitched the party on Margaster
    handling distribution of goods recovered in the Phandalin hinterlands. Denied
    Margaster involvement in Elara's death.
- name: Alducia
  type: npc
  source: summaries/20260729 (Ch. 47)
  note: 'The daughter Aldus Hern invented on the spot rather than admit Vukradin''s
    autograph was for himself (Ch. 47). Fictional — she does not exist. Vukradin clocked
    the lie and wrote the dedication anyway: "To Alducia, with love — Vukradin."'
- name: Common Chord
  type: location
  source: summaries/20260729 (Ch. 47)
  note: Neverwinter tavern in the dock area past the Protector's Enclave. Vukradin's
    old venue, where he was periodically allowed to play and then thrown out without
    pay; now the hardest ticket in the city. Brewbarry remembers only the ale ("All
    I remember is a shitty ale. Good music, but shitty ale.").
- name: Counting House
  type: location
  source: summaries/20260729 (Ch. 47)
  note: Neverwinter financial institution. The party holds a letter of recommendation
    for it and intends to use it to investigate the Lionshield Coster supply-chain
    disruption caused by the Displacement Manifold going dark. A Lord's Alliance letter
    advising caution about "certain adventurers from Phandalin" has already arrived
    there.
- name: Spire of the Morninglord
  type: location
  source: summaries/20260729 (Ch. 47)
  note: Temple of Lathander in Neverwinter. The party committed to a dawn performance
    and sermon here (Ch. 47) and used the obligation to decline Neverember's proposed
    morning meeting. Referred to at the table as the Church of Lathander.
- name: Candlekeep Working Paper No. 27
  type: item
  aliases:
  - Candlekeep Report
  source: notes/session_prep/20260616_neverwinter_arrival.md
  note: '"The Hoarding Hero: Or, Why Some Adventurers Are Economically Indistinguishable
    From The Monsters They Slay." Issued by Candlekeep''s Vault of Mercantile Histories;
    argues adventurers who refuse to circulate recovered treasure are deflationary
    and functionally indistinguishable from the dragons they slay. Neverember''s lever
    on Vukradin — Aldus Hern raised the dragon comparison at the Moonstone Mask (Ch.
    47).'
- name: Laeral Silverhand
  type: npc
  aliases:
  - Open Lord of Waterdeep
  note: Open Lord of Waterdeep and First Lord of the Lords' Alliance; named at the
    table in Ch. 47 ("Lady Laeral Silverhand, who's the open Lord of Waterdeep").
    The 'Open Lord of Waterdeep' alias was previously attached in error to Dagult
    Neverember, who rules Neverwinter as Lord Protector; moved here 2026-08-03.
- name: Tuck Stonehill
  type: npc
  aliases:
  - Tuck
  provenance: on_the_fly
  source: summaries/20260623/scene_extractions_new/02_a_hero_s_welcome_at_stonehill_inn.md
  note: Son of Toblen Stonehill; present at the Stonehill Inn, Phandalin. Named on
    the fly ch46 (2026-06-23); campaign name replaces the module's Pip. GM ruling
    2026-08-07.
- name: Petunia
  type: npc
  provenance: module
  source: Dragon of Icespire Peak (adventure-dip); Butterskull Ranch
  note: Alphonse 'Big Al' Kalazorn's cow (not a humanoid NPC — typed npc as the registry
    has no creature type). Module NPC from Dragon of Icespire Peak. Recovered at Butterskull
    Ranch via Soma's Speak with Animals; grazes with Qelline Alderleaf; source of
    the Phandalin cheese, which is graded by which part of the field she grazed. Attends
    town gatherings — present on the town green for the UBT proclamation (ch46).
- name: Kazneporium Ketternopappux
  type: deity
  aliases:
  - KP
  note: Gnome wizard / planar optimizer; offstage structural antagonist; cosmic entity
    whose on-screen agent is Aletra Sotorra; documented in docs/KP.md
- name: Kostadinious the Sage
  type: npc
  note: In-world biographer who recorded KP's story. NOT KP — see notes/corrections/kp_identity_attribution.md.
- name: Aurelan Vance
  type: npc
  aliases:
  - Aurelan
  source: summaries/20260811 (Ch. 48)
  note: Banker at the Counting House, Neverwinter. Drafted ahead of play in notes/npcs/aurelan-vance.md
    as a Moonstone Mask guest (retired Enclave trade magistrate); GM ruling 2026-08-13
    confirms the Counting House loan officer played in Ch.48 is the same NPC. Signed
    Brewbarry's bathrobe-business loan with Linene Graywind as shipping agent, pushed
    House Margaster as a cheaper distributor, and directed Vukradin to the Neverwinter
    Commission letter of credit. Canonical spelling is Aurelan per the 2026-08-13
    GM ruling. The forms 'Oral B. Vance', 'Andrell', 'Andrew/Andres/Andrey/Andre'
    and the summarizer-invented 'Ondrell B. Vance' are TRANSCRIPTION GARBLES recorded
    in notes/vtt_transcription_corrections.md and are deliberately NOT aliases. Distinct
    from Andrella, the Beached Leviathan barmaid. CH48 STAGE-3 (2026-08-16) - the
    narration's rendering of the first-hearing joke was changed from 'Oral B. Vance'
    to 'Aurum Bee Vance' at GM instruction, to strip the real-world brand reference;
    the party mishears his name as something that sounds like a meadery before he
    restates it correctly. 'Aurum Bee Vance' is LIKEWISE NOT AN ALIAS - it is a one-time
    in-fiction mishearing, blessed as a comic beat, and a future consistency or spell
    pass must not silently normalize it to Aurelan.
- name: dreamlily
  type: item
  provenance: on_the_fly
  source: summaries/20260811 (Ch. 48)
  note: Narcotic. Introduced in ch48 NARRATION by Soma as what an illegal back-room
    alchemy operation in Neverwinter would be cooking - 'some alchemist cooking dreamlily
    to rot the sons of merchants'. AUTHORED IN NARRATION at GM instruction (2026-08-16
    stage-3 de-anachronization pass), replacing the transcript's real-world 'meth
    lab' joke - NOT played at the table and NOT in prep. No properties, price, legality
    or distribution established beyond mind-harming and illicit.
- name: cadet house
  type: concept
  provenance: on_the_fly
  source: summaries/20260811 (Ch. 48)
  note: 'Menzoberranzan institution, described by Valphine in ch48. A House wanting
    a rival poisoned founds a lesser house with its own crest, name and separate ledger;
    the lesser house acts; the Matron then tells the Ruling Council ''that was not
    my hand.'' Valphine: the Council has not believed it once in nine hundred years,
    and it has never once failed - ''the words are the wall. Everyone sees through
    it; nobody may say so aloud.'' Her read on a Neverwinter banker''s between-departments
    excuse, and the campaign''s working metaphor for laundered agency. AUTHORED IN
    NARRATION at GM instruction (2026-08-16 stage-3 de-anachronization pass), replacing
    the transcript''s real-world ''Chinese wall'' joke - NOT played at the table and
    NOT in prep.'
- name: Orcanese
  type: concept
  aliases:
  - Orc language
  - Orcish
  source: GM ruling, voice-smooth review round 2, 2026-08-18
  note: 'Table term for the Orc language. GM-confirmed 2026-08-18: not a transcription
    garble of "Orcish" — "Orcanese is our way of saying ''orc language''" at this
    table. First heard scene 10 of the 2025-05-28 (chapter 3) session: "Do you speak
    Orcanese?"'
- name: Jimble the Unmoved
  type: npc
  provenance: on_the_fly
  source: Phandalin ch3 scene 07 narration, sage's marginal note (voice-critic pass,
    GM-approved 2026-08-18)
  note: 'Legendary figure, not a living NPC: a cleric of the old coastal sagas who
    examined each fallen companion and pronounced him dead rather than part with the
    prayer that might have argued otherwise. Invented in a Kostadinious the Sage marginal
    note to launder Soma''s verbatim "He''s dead, Jim" table joke into canon — the
    coastal-saga framing explains why coastal Soma knows the saying and mountain-born
    Brewbarry does not. Authored in narration, never played or prepped; do not flag
    the marginal note as a fabrication in consistency passes.'
