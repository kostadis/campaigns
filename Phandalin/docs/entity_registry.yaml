    he decoded the end of the universe; ran operations from Escarlotta's cloud castle
- name: Vardis
  type: npc
  note: Wood elf cleric of Corellon (Light Domain), exiled from every temple; member
    of the Liberators of the Ordning; returned with Orsik to Parnast and knows the
    full circlet secret
- name: Valanthe
  type: npc
  note: Young drow sorcerer who seduced and robbed Horst in his merchant days, then
    vanished
- name: Whistler
  type: npc
  aliases:
  - the Ardragon
  - the Shadow Werebear
  note: Kenku member of the First Faction, mythologized across three competing registers;
    associated with the white dragon Glazhael's lair
- name: Asmodeus
  type: deity
  note: Archdevil worshipped or feared by the Ashmadai cult, whose members bear a
    brand on their chests
- name: Bahamut
  type: deity
  note: Dragon deity worshipped by Milo Goodbarrel (cleric) and the Order of the Gauntlet
- name: Corellon
  type: deity
  note: Elven deity; Vardis is a cleric of Corellon (Light Domain), exiled from every
    temple for theological flexibility
- name: Helm
  type: deity
  note: God of protection; one of the patron deities of the Order of the Gauntlet
- name: Hoar
  type: deity
  note: God of retribution; one of the patron deities of the Order of the Gauntlet
- name: Lathander
  type: deity
  aliases:
  - Morninglord
  note: Dawn deity; Valphine Sotorra became a devoted follower after her religious
    experience with sunlight on the surface
- name: Lolth
  type: deity
  note: Spider goddess, trapped in a demi-plane as part of a multi-century plan; her
    pawn Gromph Baenre's spell inadvertently triggered the Out of the Abyss crisis
- name: Myrkul
  type: deity
  note: God of death; active in the North (Dragon of Icespire Peak canon), potential
    architect of undead presence at Pirates' Skyhold
- name: Oghma
  type: deity
  note: God of knowledge; primary deity of the House of Knowledge, Neverwinter's great
    library
- name: Selûne
  type: deity
  note: Moon goddess who intervened in 1479 DR by sending shards to Toril, enabling
    the purification of the Shard of Night
- name: Torm
  type: deity
  note: God of duty; temporary priesthood installed in the Hall of Justice by Neverember
    during Tyr's absence
- name: Tyr
  type: deity
  note: God of justice; primary deity of the Hall of Justice; died in the late 1300s
    DR and was later resurrected
- name: Captain's Cabin
  type: location
  note: Harrag's private quarters, above deck on the Beached Leviathan
- name: The Deck
  type: location
  note: Third level of the Beached Leviathan; private parlor rooms available for hire
- name: The Hold
  type: location
  note: First level of the Beached Leviathan; kitchen and main tavern
- name: The Quarters
  type: location
  note: Second level of the Beached Leviathan; 12 inn rooms for rent
- name: Alchemist's Lab
  type: location
  note: Hazel's lab located between The Tatters and the Lakeside area; cheerful exception
    in the grim district
- name: House of a Thousand Faces
  type: location
  note: Tavern built in a former noble boutique; mirrors and mannequins throughout;
    basement serves as the Harper chapter's secret meeting place
- name: Nasher Warehouse
  type: location
  note: Main Nasher headquarters in Bluelake; disguised as a stone-and-wood warehouse;
    connects via tunnel to The Flickering Ember
- name: Neverdeath
  type: location
  note: Graveyard district where undead began rising after the Spellplague; residents
    eventually stopped burying dead and burned them instead
- name: The Beached Leviathan
  type: location
  aliases:
  - Beached Leviathan
  note: 3-tiered tavern built around the wreckage of the pirate ship Leviathan; frequented
    by criminals, smugglers, and sailors
- name: The Chasm District
  type: location
  note: Former giant canyon in the southeastern quarter of Neverwinter; sealed with
    powerful magic by Neverember; now open land for settlers
- name: The Flickering Ember
  type: location
  note: General goods shop run by Horst as a front for Nasher weapon-laundering; hidden
    passage connects to the Nasher Warehouse
- name: The Sewers
  type: location
  note: Unmapped sewer system beneath Bluelake; home to the Dead Rats wererat gang
    and their hidden stolen-goods vault
- name: The Tatters
  type: location
  note: Residential area controlled by Nasher rebels; serves as their primary living
    quarters
- name: Vellgard Manor
  type: location
  note: Headquarters of Mordai Vell's Ashmadai cell; large 3-story stone building
    with gates and inner wall
- name: Atrium
  type: location
  note: Interior chamber boarded to keep out sunlight; currently infested with territorial
    Myconids
- name: Dolphin Bridge
  type: location
  note: One of three bridges radiating from Castle Never's circular rock over the
    Neverwinter River
- name: Hall of Mirrors
  type: location
  note: Long hall where nobility once practiced gait; magically recreates its own
    destruction to attack intruders
- name: Neverneath
  type: location
  note: Magically protected catacombs beneath Castle Never; gained malevolent sentience
    after the Spellplague and reshapes corridors at will
- name: Sleeping Dragon Bridge
  type: location
  note: One of three bridges radiating from Castle Never's circular rock over the
    Neverwinter River
- name: The Holes
  type: location
  note: the dungeons; houses high-crime convicts with daily executions
- name: Vault of the Nine
  type: location
  note: Tomb of the Neverwinter Nine in the depths of Castle Never; rumored resting
    place of the Crown of Neverwinter
- name: Winged Wyvern Bridge
  type: location
  note: One of three bridges radiating from Castle Never's circular rock over the
    Neverwinter River
- name: Lylorn
  type: location
  note: City whose merchants recently set up a trade route through Luskan, rivaling
    the Tarmalune cartel
- name: Sword Coast North
  type: location
  note: Regional context for Neverwinter's harbor, one of few on this stretch of coast
- name: Tarmalune
  type: location
  note: Distant city whose trade cartel operates the Tarmalune Trade House in Neverwinter
- name: Xinlenal
  type: location
  note: Netherese location powered by shadow energy teleported from the Shard of Night
- name: Blacklake
  type: location
  note: Lake filled with ash from the cataclysm; dredged and renamed Bluelake by Neverember;
    Aboleth Sovereignty maintains presence beneath it via water column
- name: Blacklake District
  type: location
  note: District where New Neverwinter places the Beached Leviathan (Guide to Neverwinter
    places it in the Docks)
- name: Blue Lake
  type: location
  note: Body of water beneath which the Aboleth Sovereignty is active
- name: Bluelake District
  type: location
  note: Formerly Blacklake District; former noble estate quarter, now dominated by
    shadow factions and nightly criminal activity
- name: Castle Never
  type: location
  note: Ancient castle begun by Halueth Never; gained malevolent sentience and corridor-reshaping
    ability after the Spellplague; ruined by the cataclysm
- name: Chasm
  type: location
  note: Massive rift opened in the southeastern quarter by the cataclysm, plunging
    into a Spellplague-infected section of the Underdark; magically sealed in 1485–1486
    DR
- name: Eigersstor
  type: location
  note: Original name of the settlement founded in 87 DR around Castle Never; later
    translated to Chondathan as Neverwinter
- name: Hall of Justice
  type: location
  note: Major building in the Protector's Enclave; antechamber holds a bronze relief
    of Stroud's chess gambit; Order of the Gauntlet chapter holds Milo Goodbarrel's
    volumes and the First Faction painting
- name: Harbor authority
  type: location
  note: Commission sub-body controlling the port; connected to House Margaster's relationship
    with the Commission
- name: Neverwinter Docks
  type: location
  note: Active commercial port district, 24-hour operation, earthmotes still visible
    overhead
- name: Neverwinter River
  type: location
  note: River flowing through Neverwinter; never freezes due to heat from fire elementals
    beneath Mount Hotenow
- name: Protector's Enclave
  type: location
  note: District of Neverwinter; home of the market district, the Hall of Justice,
    and the carved stone plaque commemorating the giant-mortal alliance
- name: River District
  type: location
  note: District that declined, causing older merchants to relocate to the Seven Suns
    Coster Market
- name: School of Wizardry
  type: location
  note: Founded in 457 DR by the Covenant (Aganazzar, Ilyykur, Presper, Grimwald);
    destroyed by Red Wizards in 1081 DR
- name: Shard of the Moon
  type: location
  note: Purified form of the Shard of Night after Selûnite intervention; alabaster
    white with a moonlight stairway that descends when three shards are placed within
    or below it
- name: Tower District
  type: location
  note: Formerly wizard-tower-rich merchant district; seized by Many-Arrows orcs post-cataclysm,
    now considered cursed
- name: Upland Rise
  type: location
  note: Area logged on Neverember's orders to supply timber for rebuilding the Docks
- name: Driftwood Tavern
  type: location
  note: Three-story tavern decorated with pre-destruction Neverwinter relics; operates
    since before the Spellplague; Greycloaks meet in its basement
- name: Port Crevice
  type: location
  note: Dockside tavern managed by an unnamed young gnome; popular with sailors; harbors
    the last Many-Arrows orc scout
- name: Tarmalune Trade House
  type: location
  note: Large warehouse complex on the southern docks operated by a Tarmalune trade
    cartel
- name: Displacement Manifold
  type: location
  aliases:
  - Planar Manifold
  note: Planar routing device built and operated by the Commission at Neverwinter's
    docks as a commercial distribution service; went dark after the Commission refused
    Aletra's treaty ultimatum
- name: Helm's Hold
  type: location
  note: Location associated with the Elden Vargas incident in 1479 DR
- name: Avernus
  type: location
  note: First layer of the Nine Hells; co-residence of Tiamat and Zariel; where Iymrith
    fled after escaping the War of the Giants
- name: Calling Horn
  type: location
  note: Settlement obliterated during the Uthgardtian barbarian uprising in the War
    of the Giants
- name: Gauntlgrym
  type: location
  note: Ancient dwarven city beneath the North where adventurers awakened the primordial
    Maegera in 1451 DR, triggering Mount Hotenow's eruption
- name: High Forest
  type: location
  note: Forest region where wood elves and rangers speak of Malfire as a protective
    presence
- name: Mirabar
  type: location
  note: City with villages on its outskirts pillaged during the Uthgardtian uprising
- name: Parnast
  type: location
  note: Town where Orsik returned as guard captain after the War of the Giants; Vardis
    returned with him; setting for future player-character reunions
- name: Silverymoon
  type: location
  note: Major city of the North; Liberators of the Ordning are minor celebrities there;
    pillaged on its outskirts during the Uthgardtian uprising
- name: Pirates' Skyhold
  type: location
  note: Abandoned pirate base on a floating earthmote northwest of Neverwinter; site
    of a mysterious tragedy, rumored hoard intact
- name: Grand Emporium
  type: location
  note: Exotic pet shop run by tiefling Brimine; stocks normal, rare, and magical
    creatures
- name: Hall of Justice Vaults
  type: location
  note: Subterranean vaults, crypts, and storage chambers beneath the Hall of Justice;
    believed haunted; contains remains of honored nobles and heroes
- name: House of Knowledge
  type: location
  note: Primary temple to Oghma and Neverwinter's great library; holds centuries of
    records, rare tomes, artifacts, and government documentation
- name: Manycoins Bank
  type: location
  note: Modest stone building with an arched entrance; one of the commercial institutions
    of the Enclave
- name: Order of the Gauntlet Outpost
  type: location
  note: Faction outpost in the Enclave offering intelligence and quest work for parties
    with good intentions
- name: Seven Suns Coster Market
  type: location
  note: City's main market hub; where older merchants relocated after the River District's
    decline
- name: The Gambit
  type: location
  note: Tavern in the Protector's Enclave market district named after Stroud's chess
    gambit
- name: The Ironclad Defense
  type: location
  note: Plain stone recruitment building where Neverember is building Neverwinter's
    new city watch to replace the Mintarn Mercenaries
- name: Moonstone Mask
  type: location
  note: Upscale tavern accessible via teleporter from the Enclave; popular tourist
    destination; located on a floating earthmote
- name: Yhaunn
  type: location
  note: City over a thousand miles from Neverwinter where Moonshadow Hall originally
    stood
- name: Fisher's Float
  type: location
  note: Floating earthmote southwest of Neverwinter; home to an insular fishermen's
    guild with rumors of a sea-pact with evil entities
- name: Illusk
  type: location
  note: Territory conquered by Halueth Never around -10 DR, during which he settled
    the Neverwinter area
- name: Board Laid Bare
  type: location
  note: Mysteriously cheap ownerless restaurant run by Lim and Bellows; no alcohol;
    prices unexplained
- name: Cloak Tower
  type: location
  note: Tower that vanished entirely during the Spellplague (sent to the Far Realm
    with all wizards inside); returned months later empty
- name: Fallen Tower
  type: location
  note: Ruins of Oloadhin's destroyed wizard tower, now a neutral-ground tavern run
    by Vagdru One-Ear
- name: Shard of Night
  type: location
  note: Floating Netherese tower positioned over Neverwinter, absorbing shadow to
    power teleportation to Xinlenal; purified into the Shard of the Moon in 1479 DR
- name: Menzoberranzan
  type: location
  note: Drow city; First House is House Baenre; influence collapsed after the Out
    of the Abyss crisis
- name: Grand Dame
  type: location
  note: Former name of the Kee and Wing Casino in Yartar
- name: Kee and Wing Casino
  type: location
  note: Casino operated by Pow (formerly the Grand Dame)
- name: Moonshadow Hall
  type: location
  note: Location attacked by the Shadovar in 1379 DR; one of its towers was torn away
    and sent to the Shadowfell, eventually becoming the Shard of Night
- name: Abyss
  type: concept
  note: Planar source of the demon lords who entered the Underdark when Gromph Baenre's
    spell weakened the planar bonds
- name: Far Realm
  type: concept
  note: Plane to which the Cloak Tower and all wizards inside it were sent during
    the Spellplague in 1385 DR
- name: Material Plane
  type: concept
  note: Prime material realm where the Shard of the Moon's history unfolds
- name: Plane of Fire
  type: concept
  note: Elemental plane; source of the small fire elemental cat sold at the Grand
    Emporium, found near Mount Hotenow
- name: Shadowfell
  type: concept
  note: Plane to which the Shadovar sent a tower from Moonshadow Hall, eventually
    becoming the Shard of Night over Neverwinter
- name: Boots of Flying
  type: item
  note: Magic boots worn by Whistler; allow a kenku to hover, preserved in every iconographic
    reference to him
- name: Crown of Alagondar
  type: item
  note: Disputed succession artifact that triggered conflict at the Beached Leviathan
    in 1479 DR
- name: Crown of Neverwinter
  type: item
  note: a false heir is burned by frost and fire
- name: Death Knight-Dreadnaught
  type: item
  note: Named undead warship rumored to be anchored below the Pirates' Skyhold earthmote;
    tied to Myrkul's presence in the North
- name: Faerzress
  type: item
  note: Naturally occurring magical substance of the Underdark; Gromph Baenre's spell
    attempted to give the Drow control of it but instead weakened planar bonds to
    the Abyss
- name: Halavar's Universal Pantograph
  type: item
  note: Named magical item created by the Many-Starred Cloak order; referenced as
    evidence of the order's enchantment style connecting to the Moonstone Mask's staff
    equipment
- name: Headband of Intellect
  type: item
  note: Magic item carried by Orsik during the War of the Giants that made him the
    group's tactician; he voluntarily left it behind after the war [Campaign Canon]
- name: Leviathan
  type: item
  note: Infamous pirate vessel captained by Harrag that ran aground in Neverwinter
    and became a tavern
- name: Neverember's lion sign
  type: item
  note: Neverember's heraldic device displayed throughout Protector's Enclave as a
    symbol of his rule
- name: Aboleth Sovereignty
  type: faction
  note: Aboleth faction maintaining presence beneath Bluelake via water column; surface
    agent is Mayor Soman Galt; 'eyes' in lake sludge suggest active observation
- name: Alagondar
  type: faction
  note: Ruling lineage of Neverwinter killed in the 1451 DR cataclysm; their spirits
    haunt Castle Never
- name: Alagondar royal family
  type: faction
  note: Royal line of Neverwinter founded by Bann Alagondar; Neverember falsely claims
    descent from this line
- name: Arcane Brotherhood
  type: faction
  note: Rival wizard organization that attacked Oloadhin's tower seeking his magical
    collection
- name: Ashmadai
  type: faction
  note: Devil-worshipping cult that occupied outer sections of the House of Knowledge
    during the chaos following the cataclysm
- name: City Militia
  type: faction
  note: Harbor patrol force focused on preventing hostile ships from docking; otherwise
    permissive
- name: Counterforce
  type: faction
  note: Savras's manifested counterweight to KP; operates through individuals (Rimardo
    and Corrin); routes through personal heroic figures with Vukradin as the structural
    receiver
- name: Cult of the Dragon
  type: faction
  note: Cult led by Severin that attempted to manifest Tiamat; true architect behind
    them was Zariel
- name: Dead Rats
  type: faction
  note: Wererat gang led by Rsolk operating in the sewers beneath Bluelake; conducts
    night raids and theft
- name: Emerald Enclave
  type: faction
  note: Druidic faction convinced by Malfire to join the War of Dragons alongside
    treants and metallic dragons
- name: Exile Aesthetic
  type: faction
  note: Tribal-coded youth culture in Neverwinter; grassroots assertion that the war's
    real meaning was carried by people outside the institutional framework; Brewbarry
    is its unwilling authentic center; structurally equivalent to Stroudism arrived
    at through culture
- name: First Faction
  type: faction
  note: Informal name for the four heroes (Stroud, Milo Goodbarrel, Malfire, Whistler)
    whose combined action clinched the metallic dragon alliance and ended Tiamat's
    summoning
- name: Greycloaks
  type: faction
  note: Conservative, non-violent faction of the Sons of Alagondar; led by Madame
    Rosene; meet in the Driftwood Tavern basement
- name: House Margaster
  type: faction
  note: Noble house that stepped in to fill the distribution gap after the Manifold
    went dark; has relationship with the Commission's Harbor authority; killed Elara
    Seasong Meliamne
- name: Liberators of the Ordning
  type: faction
  note: Informal name for the adventuring party (Vardis, Orsik, Unla Key, Thistle,
    Pow) that freed Hekaton and negotiated the giant-mortal alliance
- name: Lord's Alliance
  type: faction
  note: Political alliance of major Northern cities; mobilized against Tiamat; Hekaton
    formally allied with them ending the War of the Giants; manages Orsik as an institutional
    symbol
- name: Many-Arrows
  type: faction
  note: Orc clan that previously occupied Neverwinter; last scout covertly present
    at the Port Crevice scouting for invasion opportunity
- name: Many-Starred Cloak
  type: faction
  aliases:
  - Many-Starred Cloaks
  note: Wizard order based in the Tower District whose tower is now a dungeon; Ophala
    Cheldarstorn was a member and created the Mask's magical equipment
- name: Mintarn Mercenaries
  type: faction
  note: Mercenary forces that held power in Neverwinter; Sons of Alagondar stood down
    partly to prevent them from controlling the military
- name: Nashers
  type: faction
  note: Faction of the Sons of Alagondar; seeking proof related to the Neverwinter
    Nine
- name: Neverember's Watch
  type: faction
  note: Neverwinter's city watch; conducts overt patrols and covert monitoring; deliberately
    never intervenes at the Leviathan
- name: Neverwinter Commission
  type: faction
  note: Administrative and commercial apparatus of reconstruction established by Neverember
    in 1467 DR; quasi-sovereign commercial entity controlling salvage rights, Harbor
    authority, commercial licensing, and hinterland expansion
- name: Neverwinter Nine
  type: faction
  note: Referenced as something the Nashers are seeking proof of; elite historical
    group connected to old Neverwinter
- name: Order of the Gauntlet
  type: faction
  note: Paladin/cleric martial order; Milo Goodbarrel is a renowned member; chapter
    in Neverwinter at the Hall of Justice holds the First Faction painting
- name: Red Wizards of Thay
  type: faction
  note: Thayan magical faction that aided orc hordes in the Orcgates Affair (955 DR)
    and slew Aganazzar / destroyed the School of Wizardry (1081 DR); centuries-long
    feud with Neverwinter
- name: Selûnites
  type: faction
  note: Priestesses of Selûne who aided Lady Jasmine in purifying the Shard of Night
    in 1479 DR
- name: Shadovar
  type: faction
  note: Netherese dwellers of the Shadowfell; attacked Moonshadow Hall in 1379 DR
    and positioned the Shard of Night over Neverwinter
- name: Sons of Alagondar
  type: faction
  note: Rebel faction that opposed Neverember's rule; led secretly by Madame Rosene;
    made peace and many members enlisted in Neverwinter's army
- name: Stroudite movement
  type: faction
  note: is the force that determines history; circulates the Borrim Pickwhistle pamphlet
    across the Sword Coast
- name: Sword Coast Metalworkers' League
  type: faction
  note: Guild that donated the bronze relief of Stroud's chess gambit to the Hall
    of Justice antechamber
- name: Tarmalune Trade Cartel
  type: faction
  note: Trade organization from Tarmalune operating the Trade House on the southern
    docks, competing against Lylorn merchants
- name: Thay
  type: faction
  note: Necromantic nation with operatives in Neverwinter; linked to Jawbone and undead
    disturbances at Neverdeath
- name: Thayan Forces
  type: faction
  note: Necromancer forces under Valindra Shadowmantle occupying a portion of Castle
    Never
- name: The Ashmadai
  type: faction
  note: Secretive Asmodeus-worshipping society with members in every Neverwinter organization;
    long game is to replace Neverember with a puppet in Neverwinter and Waterdeep
- name: the Covenant
  type: faction
  note: Collective name for the four founding wizards (Aganazzar, Ilyykur, Presper,
    Grimwald) who established the School of Wizardry in 457 DR
- name: The Dead Rats
  type: faction
  note: Wererat thieves' guild operating from sewers around Bluelake; offshoot of
    Luskan's thieves' guild
- name: The Graycloaks
  type: faction
  note: Political and subversive faction of the Sons of Alagondar seeking to depose
    Neverember through law and subterfuge
- name: The Nashers
  type: faction
  note: Violent anti-Neverember faction based in Bluelake; symbol is a minotaur head
    slain by a sword; uses assassination, theft, sabotage, and rioting
- name: Uthgardtian tribes
  type: faction
  note: Barbarian peoples of the North who rose up during the War of the Giants; suppressed
    by the combined giant-mortal alliance; politically associated with the losing
    side post-war; their erasure from monuments is the subtext of the Exile Aesthetic
- name: Wintershield guards
  type: faction
  note: Commission's administrative arm for recruiting and managing adventurers in
    the hinterland expansion
- name: Cataclysm of 1451 DR
  type: event
  note: Eruption of Mount Hotenow sent a pyroclastic flow through Neverwinter, killing
    nearly all Castle Never's inhabitants including the Alagondar lineage
- name: Commission Era and Hinterland Expansion
  type: event
  note: ~1492–1495 DR; post-war period when the Commission pivoted from reconstruction
    to territorial expansion and commercial enclosure of the hinterlands
- name: Conquest of Illusk
  type: event
  note: Lord Halueth Never's conquest circa -10 DR that preceded the founding of Neverwinter
    and the construction of Castle Never
- name: Crown Affair
  type: event
  note: 1479 DR; Seldra Tylmarande used a replica Crown of Neverwinter in a male disguise
    to falsely claim the throne; plot failed
- name: Displacement Manifold Incident
  type: event
  note: ~1493 DR [Campaign Canon]; Commission refused Aletra Sotorra's treaty ultimatum,
    Manifold went dark, Bimble Nackle was disappeared, Lionshield Coster's distribution
    network collapsed, House Margaster filled the gap
- name: Many-Arrows occupation
  type: event
  note: Orc seizure of the Tower District post-cataclysm; ended approximately two
    years before the campaign's present day
- name: Mount Hotenow eruption
  type: event
  aliases:
  - Hotenow eruption
  note: Volcanic cataclysm of 1451 DR that filled Bluelake with ash, tore open the
    Chasm, and killed most of Neverwinter's noble families
- name: Neverember's Rebuild
  type: event
  note: Reconstruction effort that made the Docks fully operational again by 1479
    DR, logging the Upland Rise for timber
- name: Neverwinter Succession Conflict
  type: event
  note: 1479 DR conflict over the Crown of Alagondar during which the Beached Leviathan
    was attacked and saved by adventurers and General Sabine
- name: New Neverwinter
  type: event
  note: Commercial and physical reconstruction movement begun by Neverember in 1467
    DR following his arrival with Mintarn mercenaries
- name: Orcgates Affair
  type: event
  note: 955 DR; Red Wizards aided orc hordes, beginning centuries-long feud between
    Thay and Neverwinter
- name: Out of the Abyss
  type: event
  note: ~1491–1492 DR; Gromph Baenre's spell unleashed demon lords into the Underdark;
    collapsed Menzoberranzan's influence; Valphine fled to the surface
- name: Shard Purified
  type: event
  note: 1479 DR; Selûne intervened and Lady Jasmine with Selûnite priestesses cleansed
    the Shard of Night into the Shard of the Moon
- name: Spellplague of 1385 DR
  type: event
  note: Wild magic event that altered the ward protecting the Neverneath, giving it
    malevolent sentience
- name: Stroud's Gambit
  type: event
  note: Decisive chess game played by Stroud against gold dragon Protanther; Protanther's
    concession committed the metallic dragons to the alliance against Tiamat
- name: the cataclysm
  type: event
  note: 1451 DR; adventurers at Gauntlgrym awakened Maegera, causing Mount Hotenow
    to erupt and destroying most of Neverwinter; opened the Chasm
- name: the Era of the Three Wars
  type: event
  note: Campaign Canon era label for the combined War of the Dragons, War of the Giants,
    and Out of the Abyss (~1489–1492 DR)
- name: The first fall of Neverwinter
  type: event
  note: Earlier destruction of Neverwinter referenced by the Driftwood Tavern's decor
    and Madame Rosene's memory
- name: The Spellplague
  type: event
  aliases:
  - Spellplague
  note: Magical catastrophe that altered Neverdeath's landscape and caused corpses
    to animate; also left a Spellplague-laden section in the Underdark below the Chasm
- name: Tyr's death
  type: event
  note: Death of the god Tyr in the late 1300s DR; caused the Hall of Justice to cease
    function for an extended period
- name: Tyr's resurrection
  type: event
  note: Return of Tyr after his death; prompted rededication of the Hall of Justice
    and improved Neverember's public standing
- name: Uthgardtian barbarian uprising
  type: event
  note: Part of the War of the Giants; raided Triboar, obliterated Calling Horn, pillaged
    outskirts of Silverymoon and Mirabar; suppressed by giant-mortal alliance
- name: Wailing Death
  type: event
  note: Plague striking in 1372 DR that killed most of Neverwinter's residents within
    ten days of onset, resisting magical healing
- name: War of the Dragons
  type: event
  note: ~1489–1491 DR; Tyranny of Dragons analog; Tiamat's attempted manifestation
    via Severin and the Cult of the Dragon; ended with Severin's defeat; true architect
    was Zariel
