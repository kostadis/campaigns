note: 'Proposals, not canon — but this file IS read downstream: the planning document''s `emerging` section
  renders the pending queue, so every ruling marks it stale. A GM ruling is preserved across re-proposes
  (rejected/deferred are a one-way door; a ratified candidate returns when later chapters mention it).
  Ratify on the Threads page (/grounding/threads) or with the thread_registry verbs.'
