  vtt_adjudicated: |
    Consulted BY HAND. What the check structurally could not see — which at this stage is
    essentially everything:

    THE HEADLINE CATCH: STAGE-1 FIXES HAD NOT PROPAGATED, AND THE EXTRACTOR HAD DUPLICATED
    A WHOLE BEAT ACROSS TWO SCENES. scene_extract ran 2026-08-14T20:17:45, BEFORE this run's
    stage-1 corrections. Scene 06 therefore still carried the pre-fix bullets — and worse,
    its verbatim section held COPIES of three quotes that scene 08 also held:
        "It's much safer with us."                     tape l.5495  06 L177 + 08 L295
        "Is that making it crystal clear for you…"     tape l.5519  06 L189 + 08 L307
        "…shoots a fireball at us…"                    tape l.5627  06 L224 + 08 L332
    All three tape lines fall after the Eastern Quay opens at l.4739. Left alone, the
    narrator would have narrated the paperwork-crumpling TWICE — once at the notary, once
    at the quay. This is the precise failure /staged-consistency exists to prevent, and it
    was invisible at stage 1 because stage 1 does not read the extractions.

    THE EXTRACTOR KNEW AND FILED IT ANYWAY. Scene 06's misfiled tail opened with its own
    header: "**[The Necklace Standoff Resumes — at House Margaster's docks operation, after
    the Cullen Sharpe business]**". The extractor correctly identified the location and
    still placed the block in the notary scene, where the embedded summary then absorbed it
    as notary content with the qualifier stripped. A downstream consumer reading only the
    summary would have no way to recover the truth.

    DELETION WAS CHECKED BEFORE IT WAS PERFORMED. Rather than cutting scene 06's tail on the
    strength of the three known duplicates, all 33 quote lines in the tail were diffed
    against scene 08: 24 were duplicates, 9 appeared unique. Reading the 9 showed 8 were
    trivial fragments, GM stumbles, or false negatives of the substring match, and exactly
    ONE carried unique content — the GM's "he has stuff at his house that he's happy to
    provide for you" (tape l.5643). That one was carried into scene 08 before the tail was
    removed. A blunt cut would have silently lost it.

    THE CANONIZED LINE WAS SITTING IN THE EXTRACTIONS IN ITS GARBLED FORM. The necklace-
    ownership line the GM ruled on at stage 1 appears at scene 05 L379 as the Zoom capture
    heard it — "I belong to Lady Alagondar" — which reads as Boney describing himself rather
    than answering the question he was asked ("Yes, Boney, do you know who the necklace
    belongs to? Yes or no?"). Re-transcription l.3232: "It belonged to Lady Alagondar."
    The narrator would have rendered the newly-canonized fact as its opposite.

    A TRANSCRIPT-PREFERENCE RULE THAT IS WRONG ON THIS SESSION. The re-transcription won
    three adjudications this run (Bronze Sun, "It belonged", sentence completions) but it
    garbles proper nouns badly here: "Perrin Alligander", "that imposter, never member",
    "fire and blood quest". Any repair pass must take COMPLETIONS from the re-transcription
    and NAMES from Zoom. Recorded because the naive rule ("prefer the retranscribed one")
    would have injected "Alligander" into the corpus.

    EXTRACTOR OUTPUT CORRUPTION, A DEFECT CLASS NOT IN ANY SKILL'S CATALOGUE. Two places had
    a truncated quote fused mid-string with a duplicated speaker header:
      scene 06: > "…all these flavors of insurance are, I'm sure, are… could definit**[GM]** — *as the notary…*
      scene 05: > "and suggest that, you know**[GM]** — *the fixer's offer*
    In both cases the complete quote followed on the next line, so the fix was to delete the
    corrupted fragment. Worth grepping for on every future session:
      grep -rn '[a-z]\*\*\[' scene_extractions/0*.md

    REVIEWER ERROR, CORRECTED BY THE GM MID-RUN. The reviewer wrote the notary into the
    party travelling to the Eastern Quay, in three places, reading tape l.4751 ("The notary
    hasn't… unless the notary did not come with you") as leaving it open. The GM ruled the
    notary stays. Scene 08 line 30 had already recorded this correctly — so the pipeline was
    right and the reviewer introduced the error at stage 1. Corrected in
    session-summary.md and scene 06. Recorded per /consistency-check's instruction that a
    finding stated and then corrected is more useful documented than quietly dropped.

