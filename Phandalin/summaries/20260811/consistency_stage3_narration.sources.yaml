    But the smoothing pass REWRITES THE VERBATIM QUOTE LAYER, which nothing had audited:
      - (truncated) markers: 57 in raw -> 1 in smoothed.
      - Trailing em-dash quote endings: 0 in raw -> 59 in smoothed, in all 8 scenes.
    Inspection shows this is mostly GENUINE REPAIR — it merges artificially split VTT cues
    into whole sentences (raw scene 07 L31+L32, two fragments, become one complete smoothed
    line at L36). That quietly closes the stage-2 carry_forward item about 60 surviving
    truncation markers, and explains why ZERO '(truncated)' markers reach the narration.

    The one place it went wrong is that it renders EVERY residual trail-off as an
    INTERRUPTION dash, and voice/_genre.md reserves the em-dash for interrupted speech.
    41 of those reached the narration; 40 are legitimate interruptions and one — the
    chapter's final line — was not. Fixed as finding 4.

