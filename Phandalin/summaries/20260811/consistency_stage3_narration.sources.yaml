  check_run_history: |
    THE CHECK SURVIVED A POWER-OFF AND COMPLETED LATE. Launched in the background 2026-08-16
    ~07:13 on host MyDell2024 (the laptop); the GM powered the machine off mid-run. Verified at
    11:46 that it was dead — no process, task output 0 bytes, no report file — and this manifest
    was amended to say so. It then completed at 11:49, apparently resumed on wake, exit code 0,
    report written, 18 findings.

    Recorded because the intermediate state was genuinely indistinguishable from a lost job, and
    a future run hitting the same pattern should re-check the filesystem before concluding a
    background check died. Empirical file state beat both the "still running" assumption AND the
    "it's dead" verification; only the report's existence settled it.

  method_note: |
    THE HAND SWEEP RAN FIRST AND FOUND ALL EIGHT ISSUES BEFORE THE CHECK WAS INVOKED, and it
    is the ONLY thing that found anything this stage. Every applied edit traces to that sweep
    plus hand VTT adjudication. This is therefore a deterministic-sweep stage, recorded the
    same way stage 2 was — the difference being that stage 2 chose not to run the check, while
    stage 3 tried and lost it to a power-off.

    The stage's conclusions do not depend on the missing report. On this document class the
    check was expected to be a thin supplement: narration fails on prose fabrication and voice
    drift, and six of the eight findings (render artifacts, punctuation provenance, verbatim
    fidelity) are invisible to any grounding-doc check by construction. The one finding the
    check could plausibly have caught independently — the fabricated 'Dessarin Valley' — the
    sweep had already found and the GM had already ruled on.

    Expected hit-rate caveat for this document class: narration fails on prose
    fabrication and voice drift. Grounding docs can catch a fabricated PLACE (which is
    how finding 1 surfaced) but are structurally blind to punctuation, render artifacts,
    and whether a quote is verbatim. Six of the eight findings were invisible to any
    check by construction.

