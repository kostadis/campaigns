  vtt_adjudicated: |
    THE REVIEWER'S OWN ERROR, CAUGHT BY READING FORWARD. Finding 2 was first written up as
    a CRITICAL fabrication: 'Don-Jon' returns ZERO hits on the cleaned Zoom tape, he is
    recorded Dead, and stage 1 had already deleted a 'Don Jon hold' claim from the recap as
    an error. Three independent signals all pointing at a fabricated dead co-owner.
    Reading the exchange forward to Zoom l.2143 produced 'Yeah, you, you, the Falcon and
    Don Juan' — the ASR garble the extraction had ALREADY annotated ('the transcript garbles
    Don-Jon as "Don Juan"'). The narration is verbatim-accurate and the finding was withdrawn
    before the GM acted on it. This is the exact failure /consistency-check warns about:
    ruling from the first grep window instead of reading the sequence to its end. The
    intermediate line at l.2113 ('Bon Joan was simply an agent…') is the GM's first pass and
    reads as the OPPOSITE of the ruling he lands on twenty lines later.

    WHAT THE CHECK COULD NOT HAVE SEEN — six of eight findings:
      - The two missing-space render artifacts. No grounding doc records spacing.
      - The chapter-final trail-off. Only the two transcripts settle whether Soma was
        interrupted (em-dash) or trailed off (period). Both have a full stop.
      - 'Lord Neverwinter' -> 'Lord Neverember' (scene 07 L35). The tape (Zoom l.4647) has
        Stéphane saying 'Lord Neverwinter', which is not a person. The narration silently
        corrected it to the Lord Protector, corroborated by Zoom l.315 ('a dinner with the
        Lord Protector to prepare for'). Correct, and invisible to any doc-based check.
      - 'your fines' -> 'your finds' (scene 08 L25). Same class.
      - The Commission owning the mine (finding 3) — a NEW fact, absent from every doc, so
        there was nothing for a check to contradict it with.

    DO NOT ADD A GLOSSARY ROW FOR THE NEVEREMBER SLIP. 'Lord Neverwinter' -> 'Lord
    Neverember' looks like a natural corrections-table entry and is a trap: 'Neverwinter' is
    the city name and appears hundreds of times per session. The word-boundary applier would
    corrupt the corpus wholesale. Recorded here so a future /vtt-spell-pass does not propose it.

  smoothing_layer_finding: |
    A DEFECT CLASS DISCOVERED THIS STAGE, BELONGING TO A PIPELINE LAYER NO PRIOR STAGE
    CHECKED: scene_extractions_smoothed/ is what session_doc.yaml actually feeds the
    narrator (paths.scene_extractions_dir), while stages 0-2 checked and fixed
