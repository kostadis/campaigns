calibration_decisions:
  approved_scene: "01_ambush_at_the_blood_stained_altar.md"
  approved_via: interactive Approve/Reject/Discuss artifact, GM decisions downloaded
    2026-08-18 as voice-smooth-review-ch3-20250528.md
  policies:
    - filler_removal: APPROVED — collapse stutters, false starts, backchannel
        ("uh", "um", "I mean", "all right" as bookend filler); applied throughout.
    - grammar_connective_tightening: APPROVED — collapse filler into a single
        connective, no content change; applied throughout.
    - truncation_recovered: APPROVED — complete a cut-off line only when the
        very next line by another speaker unambiguously finishes it; kept as an
        em dash otherwise, never guessed.
    - truncation_left_as_fragment: APPROVED — genuine tape cutoffs with no
        recoverable completion are rendered as a trailing em dash, not invented.
    - ooc_tooling_chatter: DISCUSS -> ruling "delete" — VTT/roll20 tooling
        logistics (init-tracker fights, map-token placement, off-mic asides to
        someone in the room) are CUT from the Voiced moments layer entirely,
        not merely lightly smoothed. Applied throughout scenes 01-10 wherever
        this class of line appeared; every cut is called out in an italic note
        at the top of the affected sub-section so the omission is auditable.
        GM-approved as P1 in the Round 2 artifact, 2026-08-18 — the broader
        application (beyond the single scene 01 instance originally reviewed)
        is confirmed correct.
  flagged_resolved:
    - id: F1 (scene 01, [The Route Decision])
      original: "Uh, there's the secret door here. And will it? Well-"
      ruling: GM said Drop the "And will it." -> rendered as "There's the secret door here."
    - id: F2 (scene 01, [The Route Decision])
      original: '...which way do you wanna go? Sure. Through here? Is that your final offer?'
      ruling: GM said Drop the embedded duplicate "Sure." -> rendered without it.

scope_rulings:
  items:
  - id: S1 (GM-approved via artifact)
    pair: ["03_archaeologists_and_altars.md", "04_the_skull_cavity.md"]
    what: The "party searches the altar room, finds a set of secret doors including
      one in a pillar" beat is verbatim-duplicated across both scenes; scene 04's
      copy is a strict subset with nothing unique.
    resolution: Kept in scene 03 (chronological home, before the long rest).
      Scene 04's Voiced moments start at "[The Little Door Beckons]"; a boundary
      note at the top of scene 04 points back to scene 03.
  - id: S2 (GM-approved via Round 2 artifact, 2026-08-18)
    pair: ["01_ambush_at_the_blood_stained_altar.md", "02_battle_with_the_ochre_jellies.md"]
    what: Scene 02's opening "[The Ochre Jellies Revealed]" (altar description,
      Soma's monster ID, Vukradin's AC 8 line, "does it even have an initiative?")
      duplicates the close of scene 01. Missed by the automated near-duplicate
      scan in the pre-survey (step 1.5) because the two copies' wording differs
      just enough to dodge exact-line matching — caught only on a second manual
      read.
    resolution: Kept in scene 01. Scene 02's Voiced moments start at
      "[Opening Pseudopods]"; a boundary note points back to scene 01.
  - id: S3 (GM-approved via Round 2 artifact, 2026-08-18)
    pair: ["09_amateur_archaeologists.md", "10_ambush_on_the_road.md"]
    what: Scene 10's opening "[Departure — Message Delivered]" (four lines,
      exact match) duplicates the close of scene 09's reward/departure coda.
    resolution: Kept in scene 09. Scene 10's Voiced moments start at
      "[The Ambush Begins — Session Clock Runs Out]"; a boundary note points
      back to scene 09.
  process_note: The automated dedup grep from step 1.5 only ran once, before any
    smoothing began, and used exact-line matching. It caught S1 (7 identical
    lines) but missed S2 and S3 because near-duplicate wording between the two
    copies fell under its match threshold. A second manual pass while smoothing
    each scene caught the other two. Future runs should treat every scene's
    OPENING beat as a suspect for silently recapping the prior scene's ENDING
    beat, not just rely on the automated scan.

garble_rulings:
  scene_07:
    - candidate: six budgeting (Valphine's mace hit)
      transcripts: single-source; no corroboration available
      reading: six bludgeoning — matches D&D damage-type vocabulary exactly;
        the original extraction's own annotation already asserted this reading
        with confidence.
      decision: APPLIED and CONFIRMED (no objection raised when surfaced in the
        Round 2 artifact, 2026-08-18). Not glossary-safe to batch — "budgeting"
        is an ordinary English word, so this stays a one-off ruling, not a
        notes/vtt_transcription_corrections.md row.
    - candidate: I guess Flashing, yes (scene 01, Brewbarry's halberd exchange)
      transcripts: single-source; no corroboration available
      reading: GM ruling in the Round 2 artifact (2026-08-18) "flashing is
        slashing" — the GM was echoing back "slashing" while confirming the
        halberd's damage type, not saying an unrelated word. Superseded the
        original guess (an isolated ASR insertion, no correction target) — that
        guess was wrong; there was a target after all.
      decision: APPLIED. Scene 01 now reads "Is it a slashing weapon? I guess —
        slashing, yes." instead of dropping the word as noise.
    - candidate: Rod M18 / Uh, the Crown of Valphine? (initiative banter)
      transcripts: checked against session_20250528_transcript.speakers.vtt directly
        (grepped the anchor "roll-off"/"18") — confirms the extraction quotes the
        tape verbatim; the tape itself just doesn't resolve into anything sensible.
      decision: DROP, per GM ruling in the Round 2 artifact (2026-08-18). Both
        fragments removed from the smoothed layer; the surrounding coherent lines
        (GM's "You did a roll-off at 18?" and Vukradin's "What'd the ogre get?")
        are kept. An italic note in scene 07 records the cut.
  scene_10:
    - candidate: Do you speak Orcanese?
      reading: either an ASR mishearing of "Orcish", or the GM inventing a joke
        language name (matches his other in-session gags, e.g. "Dragon Scales R
        Us").
      decision: KEPT AS SPOKEN — CONFIRMED canon, per GM ruling in the Round 2
        artifact (2026-08-18) "Orcanese is our way of saying orc language."
        Registered as a new concept entity ("Orcanese", persistent scope,
        aliases Orc language / Orcish) in docs/entity_registry.yaml, and added
        to the "DO NOT CORRECT — canon coinages" table in
        notes/vtt_transcription_corrections.md so future passes don't flag it.

