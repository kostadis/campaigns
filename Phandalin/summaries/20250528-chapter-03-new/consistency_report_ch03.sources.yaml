  vtt_adjudicated: |
    VTT/transcript consulted BY HAND — it was NOT a --context input to the check.

    SOURCE CHOICE. Two transcripts exist here and they are not equivalent:
      - session_20250528_transcript.cleaned.vtt — no speaker labels at all
