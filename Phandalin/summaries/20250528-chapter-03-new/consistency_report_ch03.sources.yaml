    Because this run was dominated by attribution questions, the speaker-labelled
    .md was the primary source. Its labels are imperfect (the GM's block often
    absorbs other people's lines), so every ruling below was made on CONTENT, with
    labels as corroboration only.

    SPEAKER -> CHARACTER MAP (derived, not assumed):
      kostadis = GM, and also running Brewbarry ('All right, Brewbarry So an 11
                 hits maybe?', 'Then I will rage', 'I think I'm punching this guy')
      dave     = Vukradin      wade = Soma      gary = Valphine
    Stephane was absent. Phandalin/CLAUDE.md says Gary covers Brewbarry when
    Stephane is out, but on THIS tape the GM ran him. That is the root cause of the
    recap's character collapse: Brewbarry's actions come out of the GM's mouth, so
    the summarizer had no clean speaker signal for him.

    THE CENTRAL FINDING — 'Sema' was TWO characters, not a misspelling of one.
    The check caught the spelling (glossary row: Sema -> Soma) but could not see
    that six instances were Soma and two were Brewbarry. Line 10 of the recap
    proves the summarizer thought they were separate people: it names Soma for
    Earth Tremor and 'Sema' for the rage-kill in the SAME paragraph.
      Brewbarry: 'Number one advances on the barbarian... Are you dead? Maybe...
                  No, I'm not dead. I have one hit point.'
                 'Then I will rage.' / 'I think I'm punching this guy... Rage
                  damage plus two.' / '14 points of damage. Dead.'
      Soma:      'Withdraw is, uh, pull into the turtle shell.' (wade)
                 'Oh, another hit. Oh, you're, you're knocked out.' -> 'Roll the
                  death save.' -> wade: 'Oh, it's just one D20, right?'
                 'I guess I could use another healing word- Oh ... on the turtle.'
                 -> wade: 'All right, guys. Or just leave me to bleed out.'
                 dave: 'Soma got healed? When did Soma get healed?'
    Soma is the tortle DRUID (she/her per party.md); Brewbarry is the goliath
    BARBARIAN (he/him). The recap had 'Sema, the tortle barbarian' — a phrase that
    fuses both PCs into one nonexistent third character.

    HEALING. Grepped every healing event on tape before asserting the negative
    (healing word|heal you|healed|cure wounds|hit points back|you get .* back).
    Exactly two heals, both Healing Word 2d4+3, both on Soma: 3 HP -> 11 HP
    ('So Wade, you get eight back Hey, I'm back to 11'), and the later revive.
    Brewbarry was NEVER healed — he finished on 1 hit point. The recap credited
    both heals to 'the barbarian'.

    GEM SPLIT. 'So Dazlyn goes over here... looks at Valphine and says, "So, so
    we're going to split the gems, right?"' Dazlyn opened it, not Norbus. Numbers
    verified and CORRECT as written: 'It contains 15 gem stones worth 10 gold
    pieces each' and 'they get eight, you get seven'.

    'DAZZLEGLIM' IS A GM SLIP, NOT A SUMMARIZER INVENTION. Unlike Felkur, this
    form DOES occur on tape — once, at cleaned.vtt:1443, 'one of the two dwarves
    shouts, Dazzleglim goes, Is everybody okay there?' Every other mention (9x) is
    'Dazlyn'. The summarizer latched onto the single slip. This makes it a
    legitimate glossary row (wrong form verified present in a VTT), unlike Felkur.

    ALSO VERIFIED CORRECT (no action): the 50gp holy symbol and its 'Greed is good'
    inscription; four orcs over the hill; Valphine speaking Orc; Vukradin running
    off to tell the dwarves about the body ('Oh, a body. Let me go tell the
    dwarves.' / wade: 'Just spots watching your icon zoom off.'); the Sacred Flame
    that dealt exactly 1 damage ('Really, one? Yeah, one damage'); Valphine's
    sleight of hand on the holy symbol ('Do you palm it or announce to the world
    that you found it?' -> 'I guess I'll do my sleight of hand then').

