  notes: |
    HIGH HIT-RATE STAGE, AS EXPECTED. Per the skill's own guidance, the enhanced-recap
    layer fails on numbers/attribution/ordering in ways only the VTT catches, and none of
    the grounding docs can structurally see these. Confirmed: most of the 27 findings were
    attribution drift or internal (Summary vs. Scenes vs. NPCs) contradictions introduced
    by the enhance_summary pass, not campaign-canon errors.

    A PRIOR "FIX" WAS ITSELF WRONG. Finding 3 ("We found 10") was fixed in the 2026-08-02
    one-shot run from "Felkur" to "Valphine," reasoning from the recap's own Summary text
    rather than checking the tape directly for this specific line. Direct VTT grep this run
    (line ~679: "Wade Brown: 10. We found 10") shows it's actually SOMA (Wade), cutting off
    Dave mid-sentence — matching this document's own Summary and Skull Cavity scene, which
    already say Soma. Corrected the Memorable Moments block back to Soma. Lesson: an earlier
    manifest's ruling is a hypothesis to re-verify against the tape when it touches a new
    document, not a settled fact to propagate — consistent with the skill's own guidance on
    treating prior .sources.yaml claims as hypotheses.

    DAZLYN DID SPEAK DURING THE FIRST FIGHT — JUST NOT THE LINE EITHER DOCUMENT HAD.
    Finding 26 flagged "Norbus and Dazlyn" jointly saying Norbus's "damaging spells" quote.
    VTT (line ~248-250) shows two SEPARATE, simultaneous lines: Dazlyn — "Is everybody okay
    there?" (concern for the party) and Norbus, separately — "Could you not use such
    damaging spells?" (concern for the site). Neither document had Dazlyn's actual line.
    Went back and refined Stage 0's gm-assist.md fix too (which had removed Dazlyn's
    "shouted warnings" claim entirely, for lack of this evidence at the time) to restore her
    real quote instead of just deleting her from the scene.

    GM RULING APPLIED (STANDING HOUSE RULE, NEWLY RECORDED): Vukradin never notices a party
    member palming an item unless the roll beats his passive perception — consistent with
    his established naive/trusting characterization (assumes honesty until proven
    otherwise). Applied to finding 23 (holy symbol) in both gm-assist.md and
    session-summary.md: Brewbarry and Soma witness Valphine's palm, Vukradin does not. This
    rule is durable characterization, not a one-scene ruling — worth carrying into
    Vukradin's voice file if it doesn't already say so explicitly.

    ONE PLANNED FIX WAS DELIBERATELY REVERTED. Finding 13 (jelly initiative modifier −2 in
    one fight vs. −1 in the other) was going to be standardized to −2 (matching the Dex 6
    statblock and the other fight). Reverted after re-reading full context: the −1 figure is
    embedded in a verbatim table quip — *"Like full on minus one," Soma notes drily* —
    changing the number would either orphan the joke or require inventing new dialogue to
    match, both against the standing rule to preserve table color and never alter verbatim
    quotes. Left as-is; this may be a genuine live GM inconsistency (misremembered modifier)
    that the recap accurately preserved, joke included.

    ONE PLANNED FIX WAS DOWNGRADED ON RE-EXAMINATION. Finding 7 (passive perception 15
    credited to both Valphine and Vukradin) was initially reported as VTT-resolved in favor
    of Vukradin, based on one grep hit (line ~3139, "Dave Mendenhall: 13. Highest, highest
    passive perception's 15."). On closer reading of the full document, this hit most
    plausibly corresponds to the LATER Stone Bedrooms door (chronologically after the Skull
    Cavity/gem-split content, which sits between it and the earlier Archaeologists-and-
    Altars door). The two doors may simply be two different discoveries by two different
    PCs who happen to share a passive score — not uncommon. Left both attributions as-is;
    noted to the GM rather than silently forcing a fix I couldn't fully justify.

    "WE HAD SERVANTS" — SOFTENED, NOT RESOLVED. VTT (line ~4843) has Wade Brown say this
    immediately after the GM rules Valphine can speak Orc — most likely a dry OOC quip
    riffing on "of course a drow noble had servants," not a formal in-fiction explanation
    from Soma. Reworded the Summary's hard "Soma noted" attribution to "Wade quipped from
    the sidelines" to avoid overclaiming it as settled in-fiction dialogue. Low confidence;
    flagged rather than treated as fully resolved.

