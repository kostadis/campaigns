          - { finding: 1, fix: "Hedged the religion-check (17) attribution to Valphine: roll lands on Dave's caption, GM audibly unsure whose result counts, rules it to the cleric." }
          - { finding: 2, fix: "Hedged the 22-perception treasure sweep as inferred, not tape-confirmed (Valphine's audio merges into the GM's caption in this segment)." }
