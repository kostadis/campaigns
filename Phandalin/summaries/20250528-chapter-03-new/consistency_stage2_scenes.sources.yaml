          - { finding: 2, fix: "Resolved indirectly: gm-assist.md's Summary sentence ('not about the party's wellbeing') was reworded as part of scene 06's fix (finding B.9 there, same paragraph) to 'Norbus about the potential damage... Dazlyn about the party's own safety.'" }
          - { finding: 3, fix: "Added a clarifying sentence to the sending-stones bullet: dwarves deflect both demands, stones withheld until the ruins are fully cleared, handed over only at session's end." }
