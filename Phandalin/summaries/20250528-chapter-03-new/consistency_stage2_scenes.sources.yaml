          - { finding: 10, fix: "DISCUSS, resolved by GM note ('Fix to Norbus'): 'the museum only needs half of it' reattributed from Dazlyn to Norbus in the scene summary." }
          - { finding: 11, fix: "DISCUSS, resolved by GM note ('Valphine'): split the previously-unlabeled 'I'll just pull out my dagger and sharpen it a little bit' out as its own Valphine-attributed line." }
        propagation:
          - "Also corrected two more instances of the glossaried 'Morning Lord' -> 'Morninglord' wrong-form in this scene's own verbatim quotes (not separately itemized in the report, but the same approved glossary fix as scene03 finding 6)."
        not_carried:
          - { finding: 1, note: "50gp/timeline framing — folded into the master-timeline card; gm-assist.md reworded there, scene doc's verbatim quote left as spoken (it's what was actually said at the table)." }
        gm_rulings_this_run:
          - "Nick = the GM's son, present in the room; not a glossary entry."
          - "'The museum only needs half of it' = Norbus, not Dazlyn."
          - "Dagger-sharpening line = Valphine."
      vtt_adjudicated: |
        session_20250528_transcript.speakers.vtt cross-checked directly for the 'We took a worthless piece
        of green glass' / gem-split exchange context (see scene09/10 below); no additional VTT grep needed
        for the GM-note-resolved discuss items (Nick / Norbus / Valphine) since the GM ruled directly.
      carry_forward:
        - status: OPEN
          item: "Vukradin's daggers (used throughout this session) aren't in any Ch.2-era grounding doc (world_state lists clarinet/flute + rapier). GM-confirmed real ('Vukradin had the daggers') — add to the next grounding-doc pass (docs/archive/party_ch02.md), not a scene-doc fix."

