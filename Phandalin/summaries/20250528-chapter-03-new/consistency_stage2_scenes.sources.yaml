          - { finding: 7, fix: "Reworded the 16-perception bullet to hedge the attribution: 'The GM awards the find... to Valphine (a 16 on perception, speaker uncertain in the captions)' instead of stating it flatly." }
        not_carried:
          - { finding: 4, note: "Ogre #2 / Gnomengarde timeline gap — same root cause as scene01 finding 1, already tracked at github.com/kostadis/campaigns#183. No new action." }
          - { finding: 8, note: "Brewbarry/Stéphane absence from captions — already verified TRUE session-wide in scene01's rejected finding 2 (accent-safe grep, zero hits). Applies here too; no new check needed." }
          - { finding: 9, note: "Minor interpretive stretches ('four hit points apiece', 'Norbus and Dazlyn emerge') — left as-is per the report's own 'keep both readings, mark as inferred' framing; low value to hand-edit further." }
      vtt_adjudicated: |
        Cross-referenced scene 02's already-fixed doc (docs on disk, not the tape directly) to confirm
        the mid-combat dwarf-shout block was a verbatim duplicate, not independently-transcribed content —
        same GM/Dave lines, same wording, same order, appearing in both scenes' Verbatim Moments sections.
      carry_forward:
        - status: OPEN
          item: "Confirms (does not newly discover) the scene02 carry_forward item: the GM genuinely swapped which dwarf voices which concern between the two on-tape interjections; gm-assist.md's NPC dossier still describes each dwarf's concern as fixed. No new action beyond what scene02 already logged."

