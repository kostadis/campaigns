          - { finding: 3, fix: "Gem split corrected 7/8 (party/dwarves) -> 8/7, per the GM's on-tape 'actually make it eight' and Soma's arithmetic (4 people x 2 each = 8). Propagated to gm-assist.md's Scenes and Items sections." }
          - { finding: 4, fix: "Added a hedge to the sending-stones/50gp line and its verbatim annotation: the speaker split across 'I'm here for the' / 'sending stones and...' is unconfirmed, may be entirely Soma's line." }
          - { finding: 5, fix: "Relabeled 'Scene summary (from gm-assist, verbatim)' -> '(expanded from gm-assist against the transcript)'." }
