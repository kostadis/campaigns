consistency_check:
  stage: 2
  campaign: "Phandalin"
  document_class: "scene_extractions, source: gmassist — built from gm-assist.md (Stage-0-fixed) + VTT, freshly regenerated 2026-08-16 after Stage 0/1 landed. Never checked before this run."
  session_date: "2025-05-28"
  temporal_gap: |
    Backfilled old chapter. Session predates the campaign's current (2026, ~ch45+)
    grounding docs by ~2 years and dozens of chapters. Using a throwaway config
    pointing campaign_state/world_state at docs/archive/*_ch02.md (party/planning
    likewise via --context docs/archive/party_ch02.md, docs/archive/planning_ch02.md)
    instead of the live docs — the live docs describe a much later party and would
    false-flag on level/kit/item findings.
  config: "throwaway absolute-path config in scratchpad (not committed) — campaign_state/world_state labels point at docs/archive/{campaign_state,world_state}_ch02.md. Same file used for Stage 0/1 (phandalin_ch02_archive_config.yaml), rebuilt identically since the original scratch file no longer exists on disk."
  model: "claude-fable-5 via claude-code backend (subscription, headless)."
  backend: "claude-code"
  session_prep_used: false
  session_prep_reason: "Session (2025-05-28) predates the entire notes/session_prep/ corpus (earliest file 2026-05) by ~1 year. Confirmed with user via AskUserQuestion before proceeding. Recorded per skill requirement."
  entity_registry_used: true
  speaker_map: |
    Derived from session_20250528_transcript.speakers.vtt + GMT20250528-035553_Recording (1).cleaned.dedup.md
    (cross-checked, identical speaker sets): Kostadis = GM, Dave Mendenhall = Vukradin,
    Wade Brown = Soma, Gary Young = Valphine AND Brewbarry (covering — Stéphane absent
    the entire session; confirmed via accent-safe grep for "st[ée]phane|bourdeaud" against
    all three transcript variants, zero hits in any — a naive [A-Za-z]-only speaker-label
    grep would have missed an accented dropout, so this was deliberately re-verified
    accent-safe rather than trusted from the first pass).
  sources:
    auto_loaded:
      - { label: campaign_state, path: docs/archive/campaign_state_ch02.md }
      - { label: world_state,    path: docs/archive/world_state_ch02.md }
    context:
      - { path: summaries/20250528-chapter-03-new/gm-assist.md, role: "prior pipeline stage — scene_extractions source: gmassist, built from this + the VTT" }
      - { path: docs/archive/party_ch02.md,    role: "PCs (campaign-standard, ch02-scoped)" }
      - { path: docs/archive/planning_ch02.md, role: "threats/factions (ch02-scoped)" }
      - { path: docs/entity_registry.yaml,     role: "canonical entity registry + aliases (campaign-standard)" }
      - { path: notes/vtt_transcription_corrections.md, role: "ASR garble glossary (campaign-standard)" }
      - { path: notes/vtt_known_additions.md,  role: "unpromoted confirmed names (campaign-standard)" }
  scenes:
    - scene: "01_ambush_at_the_blood_stained_altar.md"
      report: "summaries/20250528-chapter-03-new/consistency_stage2_scene01.md"
      issues_found: 7
      resolution:
        applied:
          - { finding: 3, fix: "Relabeled 'Scene summary (from gm-assist, verbatim)' -> '(from gm-assist, augmented with transcript detail)' — bullets were augmented + one new (initiative roll) bullet added, not verbatim." }
          - { finding: 4, fix: "Reworded 'discovering he'd been reading the wrong character sheet' to avoid an ungrounded pronoun; noted 'Varas' is a garble for a character sheet from a different, unrelated campaign (GM-confirmed, not a Phandalin entity — not promoted to registry/glossary)." }
          - { finding: 5, fix: "Added speaker attribution to 3 summary bullets that fused quotes from different speakers into one breath (Soma's 'big old pile of mustard' + Vukradin's AC line; the outranked/eight-years exchange split across Vukradin and Soma; 'Well, that's crap' reattributed from ambiguous-reads-as-Brewbarry to Soma)." }
          - { finding: 6, fix: "Annotated 'Devar, are you-' as almost certainly 'Dave' — inline note only, not added to the transcription-corrections glossary (too short/ambiguous a form to safely globally replace)." }
        rejected:
          - finding: 1
            ruling: "Not a scene defect. Traced to docs/chapters/chapter_02_arrival_in_phandalin.md narrating both ogre fights out of order relative to this session's dwarven-ruins content — GM confirmed chapter 2 (hand-authored, no VTT) collapsed/misordered material from what became the 20250528 and 20250603 sessions. Filed as github.com/kostadis/campaigns#183. No edit made to this scene."
          - finding: 2
            ruling: "Verified TRUE, not an error. Accent-safe grep for Stéphane/Bourdeaud across all 3 transcript variants (speakers.vtt, cleaned.dedup.md, raw GMT export) returned zero hits session-wide — Gary covering Brewbarry for the absent Stéphane is confirmed. No edit needed."
        gm_rulings_this_run:
          - "'Varas' character sheet: GM confirmed Wade had a character sheet from a different, unrelated campaign open by mistake — not a Phandalin PC, NPC, or entity. Left as-is in the verbatim quote (accurately transcribed) with an explanatory editorial note; explicitly NOT added to entity_registry.yaml or vtt_transcription_corrections.md since it names nothing in this campaign."
      vtt_adjudicated: |
        Consulted by hand (not --context): session_20250528_transcript.speakers.vtt (primary),
        GMT20250528-035553_Recording (1).cleaned.dedup.md (cross-check), GMT20250528-035553_Recording (1).md (raw).
        - Finding 2 (Stéphane absence): all three variants agree, zero hits for Stéphane/Bourdeaud in any form.
        - Finding 5 ("Varas"): all three variants transcribe identically ("Varas' character sheet") —
          confirmed a genuine ASR/real-world garble, not a summarizer invention, and confirmed by GM as
          referring to an out-of-campaign character sheet.
        - Cross-checked docs/archive/campaign_state_ch02.md + docs/chapters/chapter_02_arrival_in_phandalin.md
          (ogre content, lines ~350-478) against summaries/20250603-chapter-04-new/session-summary.md to
          confirm the real chronology: both ogre fights are narrated in the 20250603 ("New Chapter 4")
          session, occurring AFTER this (20250528) session's dwarven-ruins content, not before it.
      carry_forward:
        - status: OPEN
          item: "docs/chapters/chapter_02_arrival_in_phandalin.md and docs/archive/campaign_state_ch02.md narrate both ogre fights out of chronological order relative to the dwarven-ruins/ochre-jelly content that is actually this session (20250528, now Chapter 3). GM to reorder/split chapter 2's prose and regenerate the ch02 archive. Tracked as github.com/kostadis/campaigns#183."

    - scene: "02_battle_with_the_ochre_jellies.md"
      report: "summaries/20250528-chapter-03-new/consistency_stage2_scene02.md"
      issues_found: 12
      resolution:
        applied:
          - { finding: 4, fix: "Deleted the duplicated '[Initiative]' and '[The First Split]' verbatim blocks. gm-assist.md's own canonical scene boundary places the initiative roll + halberd/split as the closing beat of scene 01 ('Ambush at the Blood-Stained Altar'), already correctly extracted there; scene 02 had re-included the same verbatim quotes, which would have narrated the same beat twice. Replaced with a one-line editorial pointer to scene 01." }
          - { finding: 3, fix: "Reworded the opportunity-attack summary bullet: was 'Vukradin runs to hide behind the altar, triggering an opportunity attack' (implies an ally's movement provokes another ally's OA, impossible under 5e); now attributes the OA correctly to a jelly pursuing Vukradin leaving Brewbarry's threatened reach. Verbatim quotes untouched." }
          - { finding: 5, fix: "Reworded 'shoved diagonally into a corner' (inverted the actual geometry) to 'angled diagonally to clear the wall' — matches the verbatim exchange where Vukradin corrects the GM's initial straight-line placement." }
          - { finding: 7, fix: "Reworded the Starry Wisp/split bullet to stop attributing the split's cause to the radiant damage; the GM's on-tape ruling ('He's probably split by now') is vague and doesn't state a mechanism, unlike the halberd/slashing split earlier in the fight." }
          - { finding: 6, fix: "Annotated 'One down, three to go' as a live table miscount (only two jellies remained), so no downstream doc infers a phantom fourth jelly. Quote itself preserved verbatim." }
          - { finding: 12, fix: "Fixed the duplicated/corrupted speaker header ('environmental tex**Soma** — *environmental texture...*') by removing the truncated fragment; also added an editorial note that the 'plus one mace' line is confirmed (via VTT speaker label) as Wade's in-character banter, not a GM item grant." }
          - { finding: 11, fix: "Added 'Lucrotten' to the Vukradin wrong-forms row in notes/vtt_transcription_corrections.md (user confirmed via AskUserQuestion before the add, per standing spell-pass protocol)." }
        rejected:
          - finding: 1
            ruling: "Same root cause as scene 01 finding #1 (chapter-2 chronology). Already tracked at github.com/kostadis/campaigns#183 and in scene 01's carry_forward. Not a new defect; no action taken here."
          - finding: 2
            ruling: "VTT-adjudicated TRUE, not an error: both dwarf interjections transcribe exactly as the scene doc has them (first: Dazlyn=safety/Norbus=damage; second: Norbus=safety/Dazlyn=damage) — the GM genuinely swapped which dwarf voices which concern between the two interjections, live at the table. The scene extraction is accurate; the mismatch is against gm-assist.md's NPC dossier characterization (which describes each dwarf's concern as fixed), not against this document. No edit made to the scene."
          - finding: 8
            ruling: "REJECTED as a false positive. The checker guessed 'Hey, he healed me very / well, though' was one speaker split by a block boundary. VTT speaker labels confirm it is genuine cross-talk between two different real players — Dave Mendenhall then Wade Brown — not a merge artifact. The doc's existing attribution (Vukradin, then Soma completing) is already correct. No edit."
          - finding: 9
            ruling: "REJECTED as a false positive on the specific line. VTT confirms Gary Young himself said 'Nice. Natural one. Well done, Gary.' — genuine self-directed banter after a bad roll, correctly placed in his own speaker block, not a mislabel. The doc's broader caveat about GM-block diarization (other lines, e.g. the opportunity-attack question, genuinely do get absorbed into Kostadis's block) remains a valid standing caveat and is not disputed — but this specific line needed no fix."
          - finding: 10
            ruling: "Confirmed via VTT as genuine table banter (Wade improvising corrosion flavor text, not a GM item grant) — matches the report's own hypothesis. No item added to any inventory or registry. Annotated in-doc (see finding 12's applied fix) rather than left silent."
        gm_rulings_this_run:
          - "Confirmed adding 'Lucrotten -> Vukradin' to notes/vtt_transcription_corrections.md via AskUserQuestion."
          - "Confirmed applying all 5 proposed scene-doc edits (findings 3, 4, 5, 6, 7, 12) via AskUserQuestion."
      vtt_adjudicated: |
        Consulted by hand (not --context): session_20250528_transcript.speakers.vtt (primary; this scene's
        findings were resolved entirely from this file — the two other transcript variants were not needed).
        - Finding 4 (Initiative/First-Split duplication): confirmed against gm-assist.md's own scene-boundary
          bullets (scene 1 ends with the halberd/split; scene 2 opens with "the two ochre jellies attack the
          party") rather than the tape directly — a structural/provenance check, not a wording check.
        - Finding 2 (Dazlyn/Norbus swap): grepped both interjections (cues ~248-250 and ~2223-2231)
          verbatim against speakers.vtt — confirmed the doc transcribes the GM's live swap exactly as spoken.
        - Finding 3 (opportunity attack): read cues 251-256 in full — "Do I get an attack of opportunity"
          is a GM-block-absorbed question (almost certainly Gary/Brewbarry's player, per the known GM-block
          merge pattern), immediately followed by the punch-vs-halberd choice. Confirms an OA happened and
          Brewbarry took it; the ally-provoking-ally reading in the original summary bullet was the error,
          not the underlying fact.
        - Finding 8 ("he healed me"): read cues 368-379 in full. Speaker labels show cue 378 = Dave
          Mendenhall, cue 379 = Wade Brown — two distinct real players mid-banter about the 1-point Sacred
          Flame, not a single speaker split by a transcript block boundary. Checker's hypothesis was wrong.
        - Finding 9 ("Well done, Gary"): matched directly to cue 1939, speaker Gary Young, self-directed
          banter after his own natural-one roll — not a diarization artifact.
        - Finding 10 ("+1 mace"): matched to cue 2115, speaker Wade Brown (Soma's player), not the GM —
          confirms table-humor flavor text rather than an actual item ruling.
      carry_forward:
        - status: OPEN
          item: "gm-assist.md's NPC dossier entries for Dazlyn and Norbus describe each dwarf's concern (safety vs. site-damage) as fixed/distinct, but the VTT shows the GM swapped which dwarf voices which concern between this session's two interjections. Low priority — cosmetic dossier drift, not a play-affecting error. Consider softening the dossier language on a future gm-assist pass rather than editing this scene."

    # --- Scenes 03-10: reviewed via an interactive Accept/Reject/Discuss artifact
    # (published as a claude.ai Artifact, decisions exported to
    # phandalin_ch3_scene_decisions.json and read back in). No findings were
    # rejected in this run. Several "discuss" items were resolved inline via the
    # note field the GM attached to each decision; those are recorded as
    # gm_rulings_this_run on each scene, not as a separate approval step.
    #
    # Process note (GM, mid-run): this session's transcript speaker attribution
    # was produced by ASR/voice-recognition software, not manual per-participant
    # Zoom tracks, and is known-unreliable. This is why so many findings this
    # stage turned out to be diarization drift (lines folded into the GM's
    # block, a line landing on the wrong player's track) rather than summarizer
    # invention — treat any remaining "GM-confirm" / "unconfirmed" annotation
    # in scenes 03-10 as a live open question, not settled.

