upstream_repairs_made:
  # NOT a voice-smooth action. GM instruction 2026-09-01: "Repair upstream."
  what: "29 **GM**-labelled blocks in scene_extractions/ were actually a player speaking"
  method: "each quote located in the cleaned VTT for its real timestamp, then matched only to
    Zoom cues within +/-4s. An unanchored fuzzy sweep gave 51 and matched across the whole tape."
  applied: {01: 6, 02: 5, 04: 8, 06: 2, 07: 2, 08: 6}
  gm_label_count: "428 -> 399"
  held_not_applied: 9
  held_why: "matched an ADJACENT cue, not the line itself; applying them would move NPC speech
    onto a player. Held: 'I'm not forgiving you.' / 'I'm forgiving all barbarians.' (04, Toblen);
    'You know, we're just prospectors.' (07, Norbus); 'I understand your concerns...' (02, the guard);
    'Are you going to go through?' (08); 'No, you have not gone into the big room.' (08 — already
    correctly set to GM in the quote pass); 'In fact, one time he played two women...' (01);
    'It's on the internet.' (08 — Zoom reads 'It's on the initiative', different text);
    the Lathander-and-drow-combo cue (01 — a genuine splice, Gary's line fused to the GM's token tail)."
  lesson: "one of the pass's own inline guesses was wrong: 'What are your creations?' was tagged
    [Vukradin] from context; Zoom puts it on Speaker 5 (Soma). Guessing attribution from context
    is not a substitute for the second decode."

