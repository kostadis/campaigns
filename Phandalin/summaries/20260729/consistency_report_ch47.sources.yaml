  vtt_adjudicated: |
    Transcript consulted BY HAND — it was NOT a --context input to check_consistency.py.
    File: GMT20260729-035411_Recording.transcript.cleaned.vtt

    FINDING 1 — the report pointed the WRONG WAY, and this was the run's main catch.
      It recommended changing the recap to "cousin" on the strength of the grounding
      docs. The tape says the recap was right:
        2157  DM as staff:   "Her brother is over there. Maybe you want to go talk to him."
        2189  DM as staff:   "Even if her brother did want to raise her."
        3133  DM as Cassian: "he talks about how his sister..."
        2525  DM as Cassian: "My cousin told me someone was bringing it."
      That lone "cousin" is Cassian citing a THIRD PARTY who tipped him off, not his
      relation to Elara. So this was never a recap error — it was a table-vs-docs
      conflict that only the GM could rule on. They ruled for the docs, which makes the
      edit legitimate; but had I taken the report's direction on its own authority I
      would have "fixed" the recap without ever surfacing that the session contradicted
      canon. Never accept the report's choice of side on an internal contradiction.

    ROLL VALUES — ALL FOUR REAL. Worth recording as a negative result, because invented
    dice values are the dominant enhanced-recap failure mode and this run had none:
        passive perception 17        Gary Young (Valphine), VTT 484
        16 perception spot-forgery   Gary Young (Valphine), VTT 954 — verbatim
        natural 20 on perception     David Mendenhall (Vukradin), VTT 956
        22 Persuasion                David Mendenhall (Vukradin), VTT 1180
      The 22 needed a second look: an EARLIER 20 Persuasion exists at VTT 2937 (the
      fundraising speech). Two separate rolls, both real; the recap's 22 belongs to the
      gala pitch to Aldus and is correct.

    ATTRIBUTION ERROR THE CHECK COULD NOT SEE — the recap split a player from his own
    character and invented an agreement between them:
        before: 'Brewberry says it "sounds like morning erection, man" and Stephane
                 agrees it "sounds like a swinger's club."'
      Both lines are Stéphane Bourdeaud, ~2 minutes apart:
        VTT cue 1280  "That sounds like a swinger's club."
        VTT cue 1312  "Right. Sounds like morning erection, man. That's all I'm saying."
      No grounding doc could ever catch this. Merged into a single attribution.

    OMITTED NUMBER — VTT 3277: "Yes, there's now 550 gold pieces in the studio fund."
      The recap said only "a considerable sum was raised." Added.

    SELF-CORRECTION (recorded per the skill — a first reading overturned by a wider one):
      The initial speaker-roster grep returned only FOUR speakers and I nearly recorded
      this as an absent-player session, which would have made every Brewbarry attribution
      suspect. The regex was at fault, not the tape: "Stéphane" breaks a naive [a-zA-Z]+
      class. Re-run under LC_ALL=C it returns all five. Use LC_ALL=C on this campaign's
      VTTs. Had I not caught it I would have chased a nonexistent failure mode and
      distrusted correct attributions.

