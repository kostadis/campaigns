    partially_applied:
      - finding: 6
        ruling: "50gp is confirmed, not unverified — reject that half. But the recap was
          missing a number the tape does give."
        fix: "Added a Scenes bullet with the DM's total: 'there's now 550 gold pieces in
          the studio fund.' Also clarified that Vukradin received 50gp as well."
        rationale: "The report called 50gp an unconfirmed session-generated detail. Tape
          line 3205 is explicit: 'he gives Vukradin 50 gold pieces, then he gives you
          each, 50 gold pieces.' The real gap was the 550 total (line 3277), which is a
          party-finances number with downstream consequences."

    rejected:
      - finding: 2
        ruling: "GM: both names are synonyms, both work."
        rationale: "Registry canonical is Displacement Manifold, but the GM uses the two
          interchangeably. Normalizing would have flattened the GM's own vocabulary.
          Instead 'Planar Manifold' was attached as an alias so the pair stops surfacing."
      - finding: 5
        ruling: "Reject — the report wanted to import GM-side knowledge into the recap."
        rationale: >-
          The report proposed adding that Prutha is 'at Icespire Hold with five orc
          converts' from campaign_state.md. The table established only this much
          (VTT 977-993): 'Prutha, as you recall, has been sent on a quest to convert the
          orcs.' / 'Yeah, he's on a crusade. That will have consequences.' No location,
          no numbers. Module/GM truth is not party knowledge; the recap was already right.
      - finding: 7
        ruling: "Reject — table vocabulary, not an error."
        rationale: >-
          The report wanted 'Church of Lathander' normalized to 'Spire of the Morninglord'.
          Both are on tape: the GM says 'Spire of the Morninglord' (869) but Gary/Valphine
          says 'the main performance and the sermon at the Church of Lathander' (2901).
          The recap bullet is faithful to the player. Normalizing would erase what was said.
      - finding: 8
        ruling: "Not a recap error — a grounding-doc conflict. Carried forward."
        rationale: "Three documents give three different party levels. The recap never
          states a level, so nothing in it is wrong."
      - finding: 9
        ruling: "GM: Valphine has reached a level where her eyes glow."
        rationale: >-
          The report claimed the golden-eyed framing was unsupported flavor because
          world_state.md lists no such passive feature. The tape establishes it twice:
          'you now have these glowing yellow eyes, right?' (873) and 'remember you got
          the glowing eyes, everybody kind of thinks you're the avatar of the good God'
          (2369). The doc is silent about it; silence is not contradiction. Doc gap
          carried forward.

