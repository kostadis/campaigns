      why anchor-grepping a clean adjacent phrase works and grepping the garbled token does not.
  - path: session_20250603_transcript.rebuilt.retranscribed.cleaned.proper_nouns.md
    role: pre-built Zoom-vs-retranscription diff for 69 proper-noun spans
