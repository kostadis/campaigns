carry_forward:
  - >
    TOOLING DEFECT FOUND WHILE WRITING THE GLOSSARY: lint_glossary.parse_rows treats ANY pipe
    table in vtt_transcription_corrections.md as live rules, including one inside a prose
    section. A two-column provenance table there is parsed as `wrong -> canonical` with the
    columns BACKWARDS — it briefly registered `Brewbarry -> Brubit`, which a later
    apply_replacements run would have used to rewrite Brewbarry's name in a transcript.
    Caught by the lint's `chained` warning, not by inspection. Worked around by using a list
    instead of a table; the real fix belongs in parse_rows (skip tables whose header is not
    `| Wrong | Right |`).
  - >
    The summary/transcript disagreements listed under upstream_defects should be fixed in
    gm-assist, not in this layer.

