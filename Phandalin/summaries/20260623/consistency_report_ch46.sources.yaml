  notes: |
    Run shape: check_consistency.py takes a single document, so the six files in
    scene_extractions_new/ were checked in six separate runs against identical context.
    Findings therefore map 1:1 to the file needing the edit. No cross-scene run was made,
    so contradictions BETWEEN scenes (e.g. the mermaid-statue owner in scene 02 vs 05)
    are not systematically covered.

    Config workaround: the workspace config lives at Phandalin/config/config.yaml, whose
    relative `docs/...` paths resolve against config/ and break (known check_consistency.py
    limitation). A throwaway config with absolute paths for campaign_state + world_state
    was used instead. Only those two labels are auto-loaded, so nothing was lost.

    IMPORTANT — anachronistic canon in the reports. Two flags apply canon established
    AFTER this session and should not be applied as written:
      * Lord Cassian Meliamne as the mermaid-statue contact is a GM ruling dated
        2026-08-03 (per entity_registry.yaml), six weeks after this 2026-06-23 session.
        At the table the GM was audibly reaching for "Elara" and used "she". The reports
        for scenes 02 and 05 recommend substituting Cassian; that would rewrite play.
      * campaign_state.md records Elara as killed in ch46 — this chapter. The party did
        not know this at the table.

    FALSE POSITIVE (verified against the VTT, do not apply): scene 03 Issue 1 claims
    Vukradin's "Excellent, excellent idea, Valphine!" misattributes Ser Kaelen's sidebar.
    The cleaned VTT (line 2053, 00:40:49) shows Gary Young/Valphine saying "You asked the
    crowd." immediately before David/Vukradin's reply at 00:40:52 — the attribution is
    correct. The real defect is the opposite: the extraction DROPPED Valphine's line.

    The check ran against prep, so transcription-error coverage is good. Confirmed
    against notes/vtt_transcription_corrections.md: Gruberry→Brewbarry, sheetment→
    encheatment, Aldrich→Aldric, Vukerton→Vukradin, Aligonder→Alagondar all real entries.
    "Bernberry" is NOT in the glossary and is an unlisted garble worth adding.
