    \ independent sources agree gm-assist was\nwrong. Tape (session_20250812.speakers.vtt ~line 8290-8400),\
    \ read forward to\nthe end of the sequence per the adjudication discipline:\n    Dave:  \"...so Brewbarry,\
    \ you're up. Do your attack. Maybe you can finish him.\"\n    Dave:  \"He's down to three hit points.\"\
    \n    Wade:  \"So he's down to one hit point.\"     <- Brewbarry hits, does not kill\n    Wade:  \"\
    Can I attack to end the night?\"     <- Soma's turn\n    Wade:  \"Let's see if I can hit once on one\
    \ of these two tries.\"\n    Dave:  \"Dead.\"\nCorroborated by campaign_state.md (\"Soma delivered\
    \ final blow\") and BOTH bible\nch10 POVs — Soma's (\"I deliver the final strike\") and Valphine's\
    \ (\"Soma...\ndelivers the final, decisive strike\"). The recap built its climax on the\nwrong character\
    \ across three sections.\n\nFINDING 3 — quote attribution. \"He's failing upward\" at 00:42:11 is\
    \ labelled\nWade in the attributed VTT and wade in Descript; both clusterings agree and\nthe cue is\
    \ not [?]-flagged. gm-assist credited David — who is Vukradin's OWN\nplayer, so the line had also\
    \ been laundered into an in-fiction companion\nremark. Both halves fixed.\n\nFINDING 4 — REVIEWER\
    \ SELF-CORRECTION, recorded because it nearly caused a\ndestructive edit. I first ruled the Scenes\
    \ bullet \"Brewbarry delivers a\nfinal, lethal blow with his halberd to one of the harpies\" unsupported,\n\
    because the tape's only \"halberd\" hit was the GM joking that Brewbarry threw\nhand axes \"like you\
    \ were using halberds\". Widening the grep overturned it.\nAt 00:59:08 the whisper VTT has \"Gary:\
    \ So can I hit from here with my\nhelmet?\" and Descript has \"gary: so can I hit from here with my-\
    \ ... club?\".\nBoth weapon words are garbles, but the NEXT line settles the actor:\n\"Without raging?\"\
    \ — rage is Brewbarry's. Dave answers \"That is a kill.\"\nBrewbarry did kill a harpy. Deleting the\
    \ bullet would have destroyed a true\nevent. The real defect ran the opposite way: the SUMMARY omitted\
    \ the kill and\ncalled him \"missing everything in sight\", contradicting its own Scenes\nsection\
    \ (the report's finding 6). Three harpies now reconcile: Valphine's\ncrossbow (~00:52, \"I'll shoot\
    \ her with a crossbow and then finish her off...\nDead.\"), Brewbarry (~00:59), Vukradin's Vicious\
    \ Mockery.\nLesson: two transcripts garbling the same word differently is a signal to\nidentify the\
    \ actor by CLASS FEATURE, not to trust either weapon noun.\n\nFINDING 11 — GM ruling. Tape ~line 3169:\n\
    \    Dave: \"I'm going to grant myself bardic inspiration, which means I fail a saving throw.\"\n\
    \    Dave: \"If I fail a saving throw, then I can use my bardic inspiration die to possibly pass it\
    \ instead.\"\n    Kostadis: \"So you're going to start running towards saving DC.\" / \"11-11.\"\n\
    The GM never objected and adjudicated the save. Note the \"Sure\" that Descript\nshows inside Dave's\
    \ block does NOT appear in the whisper VTT — a Descript\nturn-merge artifact, so the GM's assent is\
    \ implicit-by-conduct, not an\nexplicit verbal ruling. Recorded as the weaker evidence it is.\n"
