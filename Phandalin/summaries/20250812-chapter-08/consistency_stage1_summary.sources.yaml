  vtt_adjudicated: "Transcript read BY HAND; not a --context input.\n\nFINDING 4 — THE RUN'S REAL CATCH,\
    \ and it proves Stage 0 was not clean.\nThe GM, twice (l.7339, l.7351):\n    Kostadis Roussos: \"\
    So the three, everybody but Brewbarry.\"\n    Kostadis Roussos: \"It's everybody but Brewbarry.\"\n\
    Then the results (l.7419, l.7423):\n    David Mendenhall: \"Ooh, I'm down to four.\"     <- Dave plays\
    \ Vukradin\n    David Mendenhall: \"Soma, you're down to two.\"\nSo gm-assist.md:38 was wrong TWICE:\
    \ Brewbarry was the one member explicitly\nEXCLUDED (his \"4\" is Vukradin's number, migrated), and\
    \ Vukradin's \"3\" came from\nthe harpy fight 2,500 lines earlier (l.4867: \"Vukradin with three hit\
    \ points and\nsilence concentration\"). Only Soma's 2 was right.\nThis originated in gm-assist.md,\
    \ survived Stage 0 untouched — no grounding doc\nrecords hit points, so the check was STRUCTURALLY\
    \ BLIND — and propagated into\nsession-summary.md. Exactly the fix-propagation failure this skill\
    \ exists for.\nIt also FLIPPED the report's direction: the report guessed the bible was the likely\n\
    error because the recap matched its own source. The bible was right.\n\nFINDING 8 — REVIEWER ERROR\
    \ AT STAGE 0, corrected here. Recorded because it is the\nmore instructive of the two.\nAt Stage 0\
    \ I applied the report's recommendation to re-attribute the shipwrecks from\nthe harpies to \"the\
    \ tower's corrupted beacon\", citing entity_registry.yaml (\"Moesko\n... using the beacon to wreck\
    \ ships\"). That is MODULE truth. I did not run the\n\"module truth != party knowledge\" test. The\
    \ tape (l.2815, in context):\n    David Mendenhall: \"This is what is luring all the ships to be smashed.\"\
    \n    David Mendenhall: \"So we have a moral obligation to defeat the harpies.\"\nThe party's on-screen\
    \ belief was THE HARPIES. The recap's original wording was right\nand my edit laundered GM knowledge\
    \ into party knowledge two sessions before the T9\nreveal. Fixed here by describing the wrecks neutrally\
    \ (\"broken on the rocks below\"),\nwhich is true under either reading and burns no reveal.\nLesson:\
    \ a registry citation is evidence about the WORLD, never about what the party\nlearned. On a knowledge-boundary\
    \ finding the registry is not the authority; the tape is.\n\nFINDING 11 — \"Santorini\" appears nowhere\
    \ on tape; only \"Greece\" (l.7967, l.8475).\nA clean instance of the enhancement pass inventing a\
    \ specific detail. Note the\nADJACENT invention-suspect in the same document was real: the 25-damage\
    \ Lightning\nBolt is verbatim (\"25 half damage is 12\"). Verify each individually.\n\nFINDING 12\
    \ — l.8275 \"Pushed back.\" / l.8283 Dave: \"You're pushed back.\" Wade = Soma,\nso Soma WAS pushed,\
    \ matching chapter_10's \"pushes me back\". The recap's \"shrugs off\nthe worst on her Constitution\
    \ save\" was the wrong half.\n"
