transcripts:
  independent_readings: 2
  identical_group:
    - descript_transcript.md
    - Chapter 08.cleaned.md
  identical_group_evidence: >
    2,919 lines each; 73 lines differ; every difference is a glossary name
    normalisation (Valfine -> Valphine, Krabby -> Crabby). Chapter 08.cleaned.md
    is a cleaned COPY of descript_transcript.md, not a second reading. Treating
    them as independent would have made one pass corroborate itself on every card.
  readings_actually_used:
    - name: descript_transcript.md
      role: "the independent pass; settled B1-B9 and S1"
      good_at: "common-word recovery, sentence completion, false starts"
    - name: session_20250812_transcript.vtt
      role: "the retranscription lineage the scene extractions were built from"
      caution: >
        Carries at least one fabrication absent from the independent reading —
        see finding napalm_fabrication below.
  not_checked_individually:
    - session_20250812.speakers.vtt
    - session_20250812.displaynames.vtt
    - session_20250812.partialmap.vtt

findings:
  napalm_fabrication:
    severity: high
    card: S1
    detail: >
      The string "napalm" occurs exactly ONCE in the entire session and only in
      session_20250812_transcript.vtt. The independent reading has
      "I mean, it smells like nature." (wade). This is a retranscription-only
      garble — a fabrication, not a misspelling.
    downstream_consequence: >
      The /scrub pass on the codex narration treated "napalm" as a genuine
      anachronism. The GM ruled "replace in-world" and it was rewritten to
      "a pitch fire", logged in narration/scrub_manifest_20250812.md as an
      AUTHORIAL REWRITE OF VERBATIM PLAYER SPEECH — the more serious of that
      run's two GM-authored divergences.
    action_required: >
      That manifest row should be WITHDRAWN, not amended. There was never an
      anachronism to scrub: a tortle druid calling a fouled harpy nest "nature"
      is in voice and needs no replacement. NOT yet done — see carry_forward.
    lesson: >
      Generalises the campaign's existing rule that retranscription-only garbles
      are fabrications. Here the fabrication survived a full staged-consistency
      run AND a scrub, and was laundered into a GM ruling. Grep a suspicious
      token across every reading before treating it as something said.

  valphine_short_label:
    severity: medium
    corrected: >
      An earlier version of this entry claimed Valphine "resolves to NO voice
      spec, and every line of hers was rendered without one." THAT WAS WRONG and
      is corrected here. A voice spec attaches to the NARRATOR of a scene, not to
      speaker labels on quote blocks. Both renders carry
      "narrator: Valphine Sotorra" in scene 04's frontmatter, so her spec DID
      resolve and she WAS rendered with it.
    detail: >
      The extractions label 23 blocks "Valphine". config/party.yaml declares
      "Valphine Sotorra". get_voice_note matches the full name exactly — no
      first-name fallback, no prefix rule (removed deliberately as a
      similarity-based identity assertion, CampaignGenerator#247/#175).
    what_actually_breaks: >
      sd_plan emits "narrator: Valphine" — the short label, taken from the
      extraction labels. Unrepaired, sd_narrate REFUSES TO START rather than
      rendering without a spec (#300), so this fails loudly, not silently. It did
      not reach either render only because the line was hand-repaired in
      narration_dgx/plan.md before narrating; the codex run then inherited the
      repaired plan.
    real_consequence: >
      Every future sd_plan regeneration for a session in which Valphine narrates
      reintroduces the broken narrator line and must be hand-fixed or the render
      refuses. That is the argument for a roster alias over relabelling the
      extractions, since the extractor will keep emitting the short label.
    silent_failures: >
      /no-mech's scan_quotes.py triage counts her as an NPC, so all six ch08
      scenes returned "likely roleplay — NPC speakers present: Valphine". That
      one IS silent, and it made six identical triage lines that were not
      evidence.
    not_fixed_here: "Roster/label mismatch is upstream. Reported, not patched in a derived layer."

  skill_scripts_blind_to_this_campaign:
    severity: medium
    detail: >
      find_recap.py (/remove-recap) and scan_quotes.py (/no-mech) both key on a
      "## Voiced moments" heading. Phandalin's scene_extractions/ use
      "## Verbatim moments", so both scripts parse nothing and return 0/N on
      every scene of every Phandalin session — a parse failure that reads as a
      clean audit.
    note: >
      This pass WRITES "## Voiced moments", so the smoothed layer is the first
      Phandalin artifact those scripts can actually read.

calibration_decisions:
  filler: "False starts and pure filler collapsed. Deliberate style kept."
  line_merging: >
    Consecutive short cues from one speaker merged into readable sentences.
    This is most of the 947 -> 471 line reduction; almost no content was cut.
  grammar: >
    Clear-meaning repairs applied (missing preposition, plural/possessive slip:
    "interact the altar" -> "interact with the altar", "this realms" ->
    "these realms", "to this harpies" -> "to this harpy's"). Ambiguous grammar
    left near-verbatim.
  ooc: "Table chatter smoothed lightly, kept near-verbatim, markers preserved."
  raw_capture_annotations: >
    The inline *(raw capture: ...)* provenance notes were NOT carried into the
    smoothed layer. The heading no longer claims verbatim status and the notes
    remain in scene_extractions/. Attribution defects were converted to HTML
    comments instead, so they stay visible where they matter.

