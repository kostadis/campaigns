    - {scene: "01", edit: "'a range spell' -> 'a ranged spell'", action: reverted}
    - {scene: "01", edit: "dropped the four-block harpy-retreat exchange ('He ran away' / 'Yes, it ran away over the parapet')",
       action: restored,
       note: "Also restored the timezone-yawn table-chatter line fused into the same block. Both were dropped while writing, with no card."}
  note: >
    All three were made in good faith while rendering prose and were invisible
    in the finished file. This is the check that caught them.

flagged_for_confirmation:
  b2_generalisation:
    detail: >
      B2 was ruled on scene 01's "silent spells -> silence spells". The same
      garble recurs twice more: scene 04 "drop the silent spell" and scene 06
      "Or a silent spell or something". Both were rendered as "silence", i.e.
      the ruling was GENERALISED beyond the card the GM actually saw.
    status: APPLIED_BUT_UNCONFIRMED
    why_flagged: >
      Generalising a ruling beyond its scope is itself a judgment call. Silence
      is the spell the whole encounter turns on, so consistency is the likely
      intent — but the GM ruled one instance, not three.

