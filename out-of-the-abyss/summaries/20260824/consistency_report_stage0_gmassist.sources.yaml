    Corroborated three ways: ch64's own scene list already covers those beats; ch65
    prep opens "Thorin is in free fall"; and a player asks mid-read "What did I
    observe? I don't remember."

    CONSEQUENCE FOR THE REPORT: every spelling finding it raised (#1,#3,#4,#5,#6,
    #10,#11,#12,#13,#25) was ASR damage to the GM's own already-corrected ch64 text.
    The correct fix was excision, not repair — a materially different action from
    the one the report recommended.

    s0-02 (Reader) was missed by the check entirely and found on the tape: GM asks
    "one of you is the reader, the rest of you are witness. Which is which?";
    Grygum: "I have a feeling it was me, but I don't remember for sure."; GM: "It
    was you, actually."; Grygum: "Alright, I am the reader." He then proves
    knowledge and she answers "very well, reader!" The report had accepted the
    recap's "Daz" and built its own finding #17 on top of it.

    MY OWN MID-RUN CORRECTION: I first read 01:31:46 ("He burns the counterspell")
    as settling s0-06 in favour of the Scenes block. The GM ruled "Did not do
    counterspell", which is consistent with the walk-back one cue later that I had
