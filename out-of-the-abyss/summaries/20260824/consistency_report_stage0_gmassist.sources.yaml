        reading belongs to PHB 2014 (p.265), which this table does not run — GM confirmed
        the edition 2026-08-27.
        The stage-1 pass later reversed this ruling on the strength of that same 2014
        reading, and stage-2 finding #2 reaffirmed the reversal. Both were wrong. The
        damage is restored across 9 sites in 3 files, along with two consequences the
        no-damage reading had hidden: the made save ENDS the spell, so Manshoon carries no
        disadvantage and Daz's concentration is free.
