    open_items:
      - item: "Phantasmal Killer damage."
        status: "RESOLVED 2026-08-27 — the damage stands. 13 psychic."
        detail: |
          Settled by reading the spell rather than the record. PHB 2024 (XPHB p.304):
          'On a successful save, the target takes half as much damage, and the spell ends.'
          PHB 2014 (p.265) is materially different — a failed save frightens with no
          immediate damage, a made save deals nothing. The stage-1 pass and finding #2
          both applied the 2014 reading at a 2024 table; GM confirmed the edition
          2026-08-27. Daz was reading 2024 verbatim on tape ('disadvantage on ability
          checks and attack rolls', 'he gets half the damage'), and 26/2 = 13, the exact
          figure called. The stage-0 ruling was therefore NOT a GM override of RAW — it
          WAS RAW, and stage-0 sources.yaml:56 mislabels it. Nothing was reversed by the
          GM; the audit was wrong twice in the same way.
          Two consequences the no-damage reading had hidden are now recorded: the made
          save ENDS the spell, so Manshoon carries no disadvantage and Daz's
          concentration is free.
        filed: "notes/issues/20260827_phantasmal_killer_damage_ruling_conflict.md (resolved)"
      - item: "RAW citations must name the edition."
        status: "RESOLVED 2026-08-27 — rule added to ~/.claude/skills/staged-consistency/SKILL.md."
        detail: |
          Two consecutive passes cited 'RAW' for Phantasmal Killer without checking which
          PHB the table runs, and both were wrong. Nothing in SKILL.md requires an edition
          check before a mechanics finding. The 5etools MCP was down this run, but the
          source data was on disk at ~/src/5etools-src/data/spells/{spells-phb,spells-xphb}.json
          and settled it in one read.
          SKILL.md now carries the rule in two places: a stage-1 bullet ("Never write
          'RAW' without naming the edition"), naming the on-disk fallback path, and a
          qualifier on the retraction rule — a GM taking something back mid-combat may
          be reaching for the wrong edition, so check the rule before recording the
          take-back as correct.
      - item: "'Great, Thorin. Thorin is fault.' (finding #7)"
        status: "RESOLVED 2026-08-27 — GM supplied the line: 'Thorin fell'."
        detail: "Applied to scene 01; annotation now credits the GM ruling instead of marking the words unrecoverable. Added to notes/vtt_transcription_corrections.md as a Phrase fix row."
      - item: "ASR garbles from this session not yet in the glossary."
        status: "RESOLVED 2026-08-27 — added at GM request."
        detail: |
          notes/vtt_transcription_corrections.md gained: Dazaltir onto the Zalthir row;
          'outbear, owlbearer' -> owlbear; and seven multi-word Phrase-fix rows
          (Rip-top A-plus, Accrid and sweltering, into the candyard, archaic conmen,
          okay chorale moment, if Lala was going through me, plus the two read-aloud
          collapses 'Alyss proved right' and 'Thorin is fault'). Multi-word form so no
          single common word is ever the match target.
          Deliberately kept OUT as real-word landmines, documented in Notes for future
          passes: Albert -> owlbear (common given name, same class as Hugh -> Thorin);
          mansion -> Manshoon (Manshoon now has THREE real-word garbles held out —
          machine, Mushroom, mansion); Alyss (name-shaped garbage, never a registry
          alias); Evaldo (likely genuine player speech, not ASR). Barkerfly unrecovered.
