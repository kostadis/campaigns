      Document-Level Note). Prep doc's opening line and the DM's own explicit
      mid-session statement ("you just got attacked by three Helmed Horrors")
      both confirm three is correct.
    - Issue 2 ("pit fiend"): VTT shows the DM and players calling Moziqodo
      "the Pit Fiend" repeatedly and by name in actual play -- the recap
      faithfully transcribes table usage, even though it conflicts with
      Moziqodo's demonspawn/CR5 stat block. Same conclusion reached
      independently in the prior gm-assist.md check today (see that report's
      sources.yaml).
    - Issue 4 (Daz's fire in the sanctum) and Issue 7 (Grygum's radiant AoE):
      both phrases are drawn verbatim from the DM's own "previously on" recap
      read aloud at the top of this session's VTT -- faithful transcription
      of the DM's own words, not a recap invention.
    - Issue 5 ("natural 1 rescued into a 26"): VTT confirms the sequence
      (nat 1 -> Grygum's Help -> new roll of 26); the report's objection is a
      phrasing/rules-pedantry nitpick, not a factual error.
    - Issue 6 (Thaumaturgy producing fire): VTT shows the player explicitly
      said "Thaumaturgy, fire play" and the DM ruled it worked at the table --
      faithful to actual (if not RAW-accurate) play, not a recap error.
    - Issue 9 (Moziqodo containment tense): DM said live at the table "she
      keeps him locked in a magical sanctuary to protect him" (present tense)
      -- matches the party's in-fiction knowledge state; the "already
      escaped" fact is GM-only banked backstory the prep doc explicitly
      says does not surface tonight.

    Minor/optional, not recommended to change:
