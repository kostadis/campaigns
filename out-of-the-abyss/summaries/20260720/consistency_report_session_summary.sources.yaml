    Rejected as false positives (verified against VTT / prep, not applied):
    - Issue 1 (helmed horror count): session-summary.md is internally
      consistent at "three" everywhere (Summary, both Scenes bullets, NPCs,
      Locations) -- the report's claimed quote "two ruined suits of armor"
      does not appear anywhere in session-summary.md; that phrase is from
