        attacks. ... Zalthir just got knocked out." Daz immediately after: "That's
        my bad. I was a little bitch and grabbed the sapphire and then ran away"
        -- which pins the knockout to after the grab. Fixed.
      - "the session ends with the remaining thug severely wounded" -- he took 2.
        Grygum: "8 on one of them." GM: "He dies." Grygum: "And 2 on the other."
        Fixed.

    Verified accurate, no change needed:
