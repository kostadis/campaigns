        Like, within the last half hour." (Grygum used +5 Medicine to ask.)
      - Grygum noticing the chant stop -- player-initiated on tape: "Once it stops,
        I notice that it stopped."
      - The sapphire sequence: produced, smashed, Daz telekinesis reaction, grabbed
        "out of his hand just before he wanted to grab it", then fake-passed to
        Grygum ("I now have one key and one sapphire").

    Reviewer note -- no mid-run self-corrections were required this run. The
    absent-player check was done BEFORE any attribution ruling, which is what kept
    the Zalthir findings honest; had it been skipped, the duplicated knockout would
    most likely have been read as two separate real events.
