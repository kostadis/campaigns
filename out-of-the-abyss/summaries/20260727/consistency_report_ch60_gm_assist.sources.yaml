        ruling: "Table ruling, not a rules error."
        rationale: |
          GM verbatim: "Yes, but he is a wizard. Not used to fighting. But he does
          have mage armor, so the spell does not affect him." Grygum had just rolled
          13 to hit with Guiding Bolt. The recap transcribes the GM's own ruling.
          The report additionally misread the recap as attributing mage armor to
          Grygum -- the recap says "the wizard's mage armor", which is correct.
      - finding: 2
        ruling: "Retracted GM slip, resolved ON TAPE in favour of the bow. Do not 'correct' to crossbow."
        rationale: |
          Grygum: "Okay, and probably one of them has a bow."
          GM: "Yeah, actually, that's the thing you notice, that you don't... nobody
          does have a bow." [ASR renders the word as "boat"]
          ...then, answering Daz asking whether one of the raiders shot the guard:
          GM: "Yes, yes, yes, I should have made... that was... that was my mistake,
          yes, one of them does have... yes, one of them does have a bow, sorry, oh
          my god."
          The walkway victim is a crossbow bolt (GM, line 721: "the crossbow bolt's
          fletching"). The bow/crossbow mismatch is the GM's own, settled live in
          favour of the bow. Applying the report's fix would overwrite a live ruling.
      - finding: 8
        ruling: "Glabbagool runs as a sidekick with his own token and action economy."
        rationale: |
          Tape: "However, Zalthir... And Glabbagool show up over here" (separate
          tokens); "Also, Glabbagool's on top of him, so Glabbagool could always
          help him"; "Glabbagool has to go all, you know, ballistic."
          Prep: "Party: L9 x4 (Zalthir, Thorin, Grygum, Daz) + Glabbagool as sidekick."
          A dedicated sheet exists at notes/sessions/handouts/glabbagool_shadow_monk_sidekick.md.
          The report generalised world_state.md's arm-bond flavour text against
          established table practice.
      - finding: 11
        ruling: "'Chapter 60' is correct for the session counter."
        rationale: |
          The previous session (summaries/20260720/) is labelled "Chapter 59: The Key
          is Secured" across its recap, narration and consistency report. Chapter 60
          follows it directly. The confusion is the campaign's three disagreeing
          counters (chapter-file number, internal header number, extract number),
          already documented in notes/issues/20260727_grounding_docs_stale_ch62.md.
      - finding: 15
        ruling: "Not a claim about this session."
        rationale: |
          Fembris has ZERO mentions across all three transcripts of 2026-07-27. The
          GMAssistant export accumulates NPC/Location/Item entries arc-wide -- the
          Locations section likewise lists Bookwyrm's Office, the Sea Warden's Tower
          and the North Gallery Rotunda, all prior-session sites. Only the "Bookworm"
          spelling inside the Fembris blurb was a real defect, and it was fixed.
      - finding: 16
        ruling: "Same accumulation behaviour; no change made."
        rationale: |
          Kalan has ZERO mentions on this session's tape. His blurb summarises the
          prior session. The prep's "Kalan -- Alive, vindicated, holding the lattice"
          is next-session carry-forward state, not something that happened on screen
          this session. Left for the GM to fold in if the blurb is meant to track
          current state rather than the arc.
