      DC 17 Dex (Tasha's Caustic Brew)          "They need to get us a 17 dexterity save"
      8 acid -> thug dies                       "8 on one of them." / "He dies."
      2 acid -> thug survives                   "And 2 on the other."
      Stealth 16 / Passive Perception 16        "Grygum: 16." / "his passive perception… 16"
      attack roll 13                            "I got a 13, which is lousy"
      Initiative Daz 20 / Thorin 15 / Grygum 13 "20. It's in the…" / "I got 15." / "Mine's 13."
      Passive Investigation 24                  "My passive investigation's now 24."
      +5 Medicine                               "I have plus 5 medicine."
      Sleight of Hand 19                        "I rolled a 19 on my sleight of hand."
      Telekinesis save DC 17                    "And the saved DC is 17."
      1-in-56 chance                            "Like, that is, like, a 1 in 56 chance."
      31 years / 11 years                       both verbatim in A'lai's monologue

    This matters: INVENTED PRECISE DICE VALUES is the #1 documented failure mode
    for the enhanced-recap class, and the local model did NOT commit it once
    across ~19 checkable values. It also correctly discarded a retracted number
    (Thorin said "21 points of damage. Oh, wait, no, that's against Undead,
    so it's… 13 points of damage" — the recap records 13, not 21).

    GOT WRONG — exactly two defects, both in the ORDERING/CONSISTENCY class:
      1. REGRESSED an applied human fix (the Zalthir knockout — see below).
      2. Swapped an attribution between two sections (the history rolls).

    Read together: on this task the local model is reliable as a RENDERER of
    verified detail off the tape, and unreliable on ORDERING and CROSS-SECTION
    CONSISTENCY — which is precisely the split the global LLM-pipeline rule
    predicts. It is not a reason to stop using the DGX for this pass; it is a
    reason to always run a consistency check downstream of it, and specifically
    to diff the enhanced output against the corrected source recap.

  regression_of_prior_fix: |
    ⭐ THE MOST IMPORTANT FINDING OF THIS RUN.

    The prior run corrected gm-assist.md Summary para 3 from
      "...hammering Zalthir with blow after devastating blow until the monk
       collapsed unconscious..."
    to
      "...hammering Zalthir hard enough to stagger him."
    and moved the single real knockout into para 4, after the sapphire theft.

    The DGX enhancement pass REVERTED that fix — session-summary.md para 3 came
    back as "hammering Zalthir hard enough to knock him unconscious" — while
    KEEPING the prior run's inserted para-4 knockout. Net effect: the enhanced
    document knocked Zalthir unconscious TWICE.

    This is a general hazard, not a one-off: a human fix applied to a source
    recap can be undone by a later automated pass over that recap, and the
    result looks like fresh model output rather than a regression. Anything
    that re-runs enhance_summary over a hand-corrected gm-assist.md must be
    followed by a diff of the two files. Recorded in carry_forward.

    The prior run's OTHER content fix (the "severely wounded" thug -> 2 damage)
    SURVIVED and was improved: the enhancement independently recovered the
    correct "8 damage / dies" and "2 damage / still standing" split from tape.

