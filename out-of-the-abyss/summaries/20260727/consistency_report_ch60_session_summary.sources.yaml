    Calibration datapoint on what the DGX enhancement pass gets right and wrong.

    GOT RIGHT — every single numeric value it added, verified verbatim on tape:
      26 damage to Daz from two Arcane Bursts   "Takes 26 points of damage."
      "then he turns on Zalthir and misses"     verbatim GM line
      29 damage to Zalthir (third burst)        "29 points of damage. Ouch, goes Zalthir."
