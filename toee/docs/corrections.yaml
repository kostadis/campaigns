    truth: >-
      The species attributions are reversed. Verify against the character
      sheets before using any species-derived trait for either PC.
    as_of: null
    recorded: 2026-08-04
    recorded_by: GM
    verified: false
    note: >-
      NOT REPRODUCIBLE ON DISK. Re-verified 2026-08-06 and the evidence has
      moved since the 2026-08-05 pass, so this note supersedes the one in
      contracts/corrections.md. docs/party.md now declares a species for every
      PC — Calmer Human (line 44), Zephyr Tiefling (line 73), Zinnia Elf
