  - id: calmer-alive-undercover
    applies_to:
      # calmert.md does not exist today. It is listed because "Calmert" is a
      # recorded alias and a future `planning --build-dossiers` run could
      # create the file under that spelling; a path that matches nothing is
      # harmless, and `provenance check` only flags an entry when NONE of its
      # paths match.
      paths: ["docs/npcs/calmer.md", "docs/npcs/calmert.md", "docs/*.md"]
      subjects: ["Calmer", "Calmert"]
    stale_claim: >-
      "Status: Dead. Body recovered intact as of Planting 24, 579."
      (docs/npcs/calmer.md line 40)
    truth: >-
      Calmer is a LIVING PC. He was raised from the dead by Terjon and operates
      undercover as Supreme Prophet of the Upper Temple. The dossier's own
      hand-written banner (lines 3-7) says so, and the next
      `planning --build-dossiers` run will destroy that banner.
    as_of: null
    recorded: 2026-08-04
    recorded_by: GM
    note: >-
      Re-verified 2026-08-06: both halves are still true on disk simultaneously
      — the hand-written STALE banner at lines 3-7 and the generated
      "Status: Dead" at line 40 are in the same file. This is the corpus's live
      example of "generated AND hand-edited afterward": the manifest declares
      docs/npcs/*.md generated by `planning`, so the file stays labelled
      generated (the hand edits do not re-tier it) and the envelope
      additionally raises generated_but_hand_edited.

