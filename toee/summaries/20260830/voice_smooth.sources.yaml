    finding: >-
      Kostadis is both the GM and Calmer's player. After the `gm: true` fix in
      config/players.yaml (commit b44ca28b), speaker_map overwrites every one of his
      lines with the GM label — so Calmer has ZERO speaker labels in this session's
      scene files. 473 GM blocks, 0 Calmer blocks.
    consequence: >-
      Calmer's voice spec resolves correctly but would never be reached, and the narrator
      would get a chapter in which a PC never speaks under his own name.
    where_calmer_actually_speaks: 20 GM blocks carrying an italic "*as Calmer, ...*" direction
    handled_by: calibration class C4 (stage-direction split), NOT by re-attribution
    upstream: >-
      The label is correct as a record of who spoke. Whether session_doc should route
      "*as Calmer*" blocks to calmer_voice.md is a pipeline question, not a voice-smooth
      one. Carried forward.

