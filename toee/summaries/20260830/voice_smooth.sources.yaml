    - "G58 — completed a truncated cue as '...whack you with theirs.' Reverted; the possessive was invented."
    - "G31 — deleted the GM's '200 points of damage?' mishearing. Restored; it is a number and part of the beat."
    - "G59 — deleted the GM's dice-reading mutter. Restored and carded."
    - "G60 — repaired 'a stunt on a failed save' to 'on a failed save' and 'stun condition' to 'stunned condition'. Reverted; carded."
    - "G61 — reinterpreted 'kill him or Zephyr' as direct address. Reverted; carded, because it changes who the sentence is about."
    - "Scene 05 — rendered 'He looks at it funny' as 'He looks at it, amused' and 'they notice' as 'they noticed'. Both reverted."
  note: >-
    All seven were made in good faith while writing prose and all seven read as clean.
    That is exactly why the audit exists.

