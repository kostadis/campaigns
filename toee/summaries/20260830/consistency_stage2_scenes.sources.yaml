resolution:
  the_finding_the_report_could_not_make: |
    SYSTEMIC ATTRIBUTION COLLAPSE, found by hand before the audit was ruled on.

    Six scenes carried only FOUR speaker labels — the PCs — and ZERO GM or NPC labels, in scenes
    describing Falrinth (24 mentions), Varek Solain (31), the Minotaur (16), Dren Halveth (25),
    Skole and Lucius Graeme all speaking. Calmer held 390 attributions, more than the other three
    PCs combined; 107 of them (27%) were demonstrably not Calmer — 44 glosses naming an NPC, 43
    table mechanics, 21 referring to Calmer in the third person, 16 opening with GM narration.

    Every other session distinguishes them: 20260510 GM x169; 20260524 [GM] x127; 20260614 [GM]
    x88 AND [Calmer] x43 at this same table; 20260625 even [Brother Eelrich] x9. So this was a
    regression, not a convention.

    ROOT CAUSE, one missing boolean:
      config/players.yaml kostadis entry had plays:[Calmer] and no gm: flag
        -> speaker_map() pass 2 is `if not p.gm: continue`, so it never overwrote him
        -> map resolved Kostadis Roussos -> Calmer
        -> "Speaker labels rewritten: 1319 line(s)" BEFORE the extractor ran
    campaignlib/players_config.py:91 documents this exact case as its motivating example:
    "gm and plays are independent — toee's Calmer is a GM-played PC. For speaker labelling the
    game-master label wins."

    FIXED with `gm: true`; speaker_map now returns Kostadis Roussos -> GM. Output went from
    390 **Calmer** / 0 **GM** to 473 **GM** / 0 **Calmer**, with the real speaker named in each
    gloss ("as Varek", "as Dren, delivering the logistics report", "as the hooded figure").
    Calmer remains distinguishable as a PC through those glosses, so nothing was lost.

    NOTE ON THE FIRST RE-RUN: scene_extract skipped all six files ("Already extracted: 6
    (skipped — pass --force to redo)", "Wrote 0 scene file(s)"). The speaker map was already
    correct in that run's INPUT and never reached the output. --force was required.

  my_own_error_that_the_audit_caught: |
    D03 finding 1 challenged a fix I had applied at Stage 1, and it was right.

    I had written that Calmer recast Spirit Guardians, spending a second third-level slot, in
    three places in session-summary.md, on the strength of cue 1031 — "he's gonna go with Spirit
    Guardians again". I never read what happened next. His turn went: Healing Word, move, Word of
    Radiance, then "Okay, Zephyr. You're up." The spell was NEVER re-established. Exhaustive check:
    the entire tape contains exactly TWO Spirit Guardians mentions — one real cast (cue 863) and
    one abandoned intention (cue 1031).

    Reverted in session-summary.md (3 places) and corrected in gm-assist.md, which had also said
    "Cast twice". The Spells entry now records WHY, so it does not get "fixed" back.

    Word of Radiance WAS genuinely cast twice — cues 3939 and 4191 by tape line, both resolving
    with Constitution saves and damage (12, then 11) — and those entries were left alone. That is
    the discipline I skipped on Spirit Guardians: confirm the announced cast actually RESOLVED.

