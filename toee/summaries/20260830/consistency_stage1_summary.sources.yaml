    - id: CF10
      status: OPEN
      inherited_from: "stage 0"
      item: "mempalace index likely stale for docs/chapters/. Re-mining is the GM's job; no mempalace or mneme binary on this user's PATH."
    - id: CF12
      status: OPEN
      inherited_from: "stage 0"
      item: "docs/campaign_state.md stale (ends ~Ch28); lists Alrrem as Alive. Regenerate rather than spot-edit."
    - id: CF14
      status: CLOSED
      opened: "2026-09-05, stage 1"
      closed: "2026-09-05, GM ruling: mark them stale, do not fake the numbers"
      item: >-
        Character sheets stale on level. Opened on docs/party/zinnia.md ("Monk 6" vs
        docs/party.md's Monk 9), but the drift turned out to be uniform: ALL FOUR sheets
        are level-6 snapshots — Cleric 6 / Rogue 6 / Rogue 6 / Monk 6, every one with
        proficiency +3, hit dice 6d8, and max HP 39/36/45/45.
      why_the_obvious_fix_was_refused: >-
        Editing "Monk 6" -> "Monk 9" on two lines would have made the sheet LIE. Level 9
        means proficiency +4, and zinnia.md keys five values off +3: Focus Points 6 (should
        be 9), Deflect Attacks DC 14, Stunning Strike DC 14, the Ability Save DC line, and
        the per-level focus entry — plus 9d8 hit dice, higher HP, and three levels of absent
        class features. The sheet is currently honestly stale and INTERNALLY CONSISTENT;
        a level-line edit would make it internally inconsistent and feed a wrong proficiency
        bonus and wrong DCs into every future check that reads it. Worse than the original
        problem. Recomputing properly is also not derivable — HP rolls, ASI/feat picks,
        subclass features and spells known are player decisions. The real fix is a D&D
        Beyond re-export through dnd_sheet.py.
      resolution: >-
        All four sheets marked with a stale-snapshot warning immediately after the
        frontmatter: what the sheet declares, what docs/party.md says, that party.md is
        canon for level, an explicit list of which derived numbers are wrong, and a
        statement that they were deliberately not corrected and why. Verified surgical:
        ZERO lines removed from any sheet, 22 added to each (the banner alone). Frontmatter
        still parses and still reads level 6 — deliberately, because that is what the sheet
        actually contains.
      new_hazard_found_and_recorded: >-
        NOT previously in any manifest. config/party.yaml registers all four sheets, and the
        party pipeline generates docs/party.md FROM them. Re-running that generator before
        the sheets are re-exported will pull level 6 back into docs/party.md and silently
        revert CF5's level fix — and, for zinnia.md, the he/him pronoun fix made the same
        day (finding 11). This makes both of those fixes fragile in a way Stage 0 did not
        record. The warning is written onto each sheet so whoever runs the generator sees it
        there; config/party.yaml itself was NOT edited, as the GM chose the
        mark-the-sheets option rather than the guard-the-config one.
      still_open: >-
        The sheets remain level-6 data. Re-exporting the four D&D Beyond PDFs and re-running
        dnd_sheet.py is the only path to true level-9 sheets, and is the GM's to do.
    - id: CF15
      status: CLOSED
      opened: "2026-09-05, stage 1"
      closed: "2026-09-05, on GM request"
      item: >-
        voice/calmer_voice.md recorded nothing about Calmer's improvised bureaucracy or the
        St. Cuthbert curriculum recast along Earth Temple lines. Voice files are
        authoritative for characterisation and this one lacked what the GM established.
      resolution: >-
        RESOLVED. 105 -> 126 lines. Added a new section, "The Org Chart", placed after "The
        Leader Who's Making It Up" because it is the same trait with evidence: he confers
        titles, cannot hold them steady (Chief of Staff at cue 659/695/5119 vs "my Chief of
        Operations plan" at 715), glosses Zinnia's post himself as "Chief of making sure my
        shit doesn't get stolen" (699), routes problems as paperwork ("Produce an
        appropriate note, and I will sign it", 659), and then second-guesses his own
        assignment seconds later (667). Written per the GM's framing that the wobble is
        HIS, not the transcript's, and with a direction to play it as sincerity rather than
        comedy. Also added a paragraph to "The Cover That's Becoming Real" on the curriculum
        — the sharpest instance of absorption in the file, since he is rewriting his own
        god's teaching using the evil temple's framework — plus four quotes and one entry
        under "Things He'd Never Say".
      provenance: >-
        The org-chart material is Chapter 34 live play (cues 659-715, 5119). The curriculum
        and "a good working relationship" come from the Chapter 33 recap span (cues around
        131-155) that /remove-recap cut from THIS chapter's documents — still canon, just
        Chapter 33's. The file's header now reads "Updated 2026-09-05 from chapters 33-34"
        rather than claiming either chapter alone.
      verification: >-
        All 7 quotes added were checked verbatim against the cleaned tape after
        normalisation; every one matched. Quote count 9 -> 13, exactly the four intended.
        The file already anticipated this material ("authority and expertise are separate
        things"; "He thinks in terms of authority and protocol. Who reports to whom.") and
        simply had no evidence for it.
    - id: CF16
