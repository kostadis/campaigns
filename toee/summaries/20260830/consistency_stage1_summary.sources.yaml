resolution:
  applied:
    - id: 4
      fix: "Spirit Guardians: cast ONCE -> cast TWICE (3 places — Summary prose, Scenes bullets, Spells entry)"
      basis: >-
        TAPE, all one fight (Greater Temple storeroom ambush): cue at line 3459 "He casts,
        Spirit Guardians"; 3823 "Calmer takes 8 points of damage"; 3827 "He loses his
        concentration"; 4131 "he's gonna go with Spirit Guardians AGAIN". The recap
        recorded the first three and stopped. gm-assist.md already said "Cast twice" and
        needed no change. Matters for slot tracking: two 3rd-level slots, not one.
    - id: 5
      fix: "Undercommon: 'no one speaks Deep Speech or Undercommon' -> Zephyr tried Undercommon; Deep Speech was the gap (2 places)"
      basis: >-
        docs/party/zephyr.md line 101 lists UNDERCOMMON among his languages, so the recap
        contradicted his own sheet. TAPE 4437 GM asks "Does anybody here speak deep
        speech, deep undercom[mon]?"; 4439 Thomas answers; 4443 the creatures sneer and
        hide. GM ruled the missing language is Deep Speech — correct for aberrations —
        not Undercommon. gm-assist.md was already right and was left untouched.
        Also separates two beats the recap had collapsed: the intimidation (4433) came
        BEFORE the language attempt.
    - id: 7
      fix: "'Chief of Staff or Chief of Operations' -> Chief of Staff, plus a new bullet recording Calmer's own confusion"
      basis: >-
        CF8 (Stage 0) already ruled Chief of Staff. Live play carries it 3x — 659 the
        appointment, 695 Calmer enumerating the posts, 5119 the end-of-session callback
        "This is why I have made you Chief of Staff" — against ONE use of Chief of
        Operations at 715, where Calmer is asking Zinnia to approve a plan, not
        conferring a title.
      gm_framing: >-
        GM ruled mid-turn that the two titles "reflect the confusion Calmer has". Recorded
        as CHARACTERISATION, not as a transcription slip: "The wobble is his, not the
        transcript's: he is inventing the org chart as he goes." Consistent with 699,
        where he defines Zinnia's post as "Chief of making sure my shit doesn't get stolen".
    - id: 2
      fix: "Skole's note: 'You thought you might enjoy the update' -> 'He thought' (3 renderings), and cue 1295 updated"
      basis: >-
        PREP WINS, GM ruling. notes/sessions/nulb-knows-now.md line 305 scripts "He thought
        you might enjoy the update" — He being Skole, the only coherent reading; "You
        thought" has the note telling its reader what the reader thought. TAPE 5187 has
        "You". GM ruled the prep is canon for the note text and that he misread it aloud.
        The recap already contradicted itself: its NPC entry paraphrased the third person.
      record: >-
        cue 1295 UPDATED IN PLACE, not added — the record allows one entry per cue and this
        cue already carried two spell-pass corrections (Skull->Skole, Tullub->Tolub). It now
        carries three.
    - id: 3
      fix: "Falrinth: 'you cannot be before to be seen. To be seen receiving one.' -> 'you cannot afford to be seen receiving one.'; and 'the gates are watching' -> 'watched' (2 places)"
      basis: >-
        PREP WINS, GM ruling. nobody-told-nulb.md line 426 reads "you cannot afford to be
        seen receiving one"; "be before" is a clean ASR garble of "afford". Line 456 reads
        "the gates are watched" — Falrinth is the one under surveillance, which is what "my
        leash is short" immediately before it says. The recap already contradicted itself:
        its Scenes bullet at :245 had "afford" while the prose carried the garble.
      record: >-
        NEW cue-1182 corrects ONLY the garbled word. Cue 1183 ("To be seen receiving one.")
        was deliberately left as spoken — that is the GM restarting the sentence, which is
        delivery, not a transcription error. Cue 1235 was EXTENDED (it already held
        Verbabank->Verbobonc) to add watching->watched.
    - id: 8
      fix: "gm-assist.md Frostbrand: 'Calmer later jokingly chided it' -> Sequoia; orphaned Ch33 opening sentence dropped"
      basis: >-
        TAPE cue 574: "Nicholas Roussos: Rosco's currently cursing at Frostbrand, like, you
        had one job." Nicholas plays Sequoia. session-summary.md was RIGHT and gm-assist.md
        was wrong — the reverse of the usual direction, and a Stage 0 miss.
    - id: 13
      fix: "cue 514 'snipton' -> 'sneak attack'; cue 519 '52 feet' -> '52 damage'"
      basis: >-
        Both ASR garbles; no document was wrong. TAPE 516 "43 damage?" + 519 "plus 9, so…
        52" is damage arithmetic, not movement. Recorded because, left alone, the only tape
        match for 52 is the word "feet", so a future numeric audit reads the recap's
        correct "52 points" as unsupported.
    - id: 11
      fix: "docs/party.md — Zinnia she/her -> he/him in all 3 locations (7 pronouns)"
      basis: >-
        ROOT-CAUSE FIX, not a symptom. party.md is passed as --context at EVERY pipeline
        stage, which is why the registry note says "extraction passes repeatedly degender
        him — check pronouns on every recap". Every other source already agreed:
        docs/party/zinnia.md states "Age / Gender / Size: 25 / Male / Medium";
        voice/zinnia_voice.md is he/him x118 (its single "her" is "a woman's grip on her
        cup" — an NPC); entity_registry.yaml says "male, he/him"; TAPE 175 says "in HIS
        life"; session-summary.md was already he/him throughout with zero feminine pronouns.
      correction_to_my_own_earlier_report: >-
        I told the GM that docs/party/zinnia.md was she/her and that the registry's citation
        pointed at the wrong file. BOTH WRONG. The sheet is a stat block with no prose
        pronouns at all and states Gender: Male outright, so the registry is correctly
        sourced. The finding was smaller and cleaner than I described: ONE stale document,
        not two, and no source conflict to adjudicate.
    - id: 12
      fix: "DECLINED — the surviving variation is meaningful"
      basis: >-
        The Ch33 cut already removed most variants. What survives names two DIFFERENT
        things the Items entry deliberately links: "black-coated bandits" (the Minotaur's
        attackers) and "Black Cloaks" (bales of Greater Temple uniforms in the storeroom).
        The entry itself says "Their presence may also connect the storeroom to the 'black
        cloak bandits' described by the Minotaur" — quoting the Minotaur's own phrasing,
        which is what makes the link land. GM ruled leave it. My original "standardise the
        adjective" recommendation would have flattened a deliberate connection.

